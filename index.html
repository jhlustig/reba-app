<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Reba">
<meta name="theme-color" content="#232720">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Reba — Cards &amp; Session Log</title>
<style>
  :root{
    --ink:#232720; --muted:#6B6F64; --bg:#F3F2EE; --line:#C6C2B6;
    --alert:#A32E1E; --card:#FFFFFF;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
       background:var(--bg); color:var(--ink); font-size:16px; line-height:1.45;}
  header{position:sticky; top:0; z-index:10; background:var(--ink); color:#fff;
         padding:10px 14px; display:flex; justify-content:space-between; align-items:baseline;}
  header .t{font-weight:700; letter-spacing:.06em;}
  header .b{font-size:12px; opacity:.75;}
  nav{position:sticky; top:42px; z-index:10; display:flex; background:#fff; border-bottom:1px solid var(--line);}
  nav button{flex:1; padding:11px 0; border:0; background:none; font-size:14px; font-weight:700;
             letter-spacing:.08em; color:var(--muted);}
  nav button.on{color:var(--ink); box-shadow:inset 0 -3px 0 var(--ink);}
  main{padding:12px 12px 90px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0;}
  .chip{padding:7px 13px; border:1.5px solid var(--line); border-radius:18px; background:#fff;
        font-size:14px; font-weight:600; color:var(--muted);}
  .chip.on{color:#fff; border-color:transparent;}
  .cardrow{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line);
           border-radius:8px; padding:11px 12px; margin-bottom:8px;}
  .cardrow .stripe{width:6px; align-self:stretch; border-radius:3px;}
  .cardrow .code{font-weight:800; font-size:13px; width:52px; letter-spacing:.03em;}
  .cardrow .ti{font-size:15px; flex:1;}
  .cardrow .ty{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em;}
  /* card detail */
  .detail{background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .detail .head{color:#fff; padding:12px 14px;}
  .detail .head .code{font-size:12px; font-weight:700; letter-spacing:.1em; opacity:.85;}
  .detail .head .title{font-size:20px; font-weight:800; line-height:1.2;}
  .detail .sec{padding:12px 14px; border-top:1px solid var(--line);}
  .detail h4{margin:0 0 6px; font-size:12px; letter-spacing:.12em; color:var(--muted);}
  .detail .txt{white-space:pre-wrap; font-size:16.5px;}
  .big .txt{font-size:20px; line-height:1.5;}
  .ifrow{display:grid; grid-template-columns:1fr 1.4fr; gap:8px; padding:8px 0; border-top:1px dashed var(--line); font-size:15px;}
  .ifrow:first-of-type{border-top:0;}
  .ifrow .if{font-weight:700;}
  .checkrow{display:flex; gap:8px; padding:6px 0; font-size:15px;}
  .checkrow .num{font-weight:800; white-space:nowrap;}
  .capnote{background:#FBF6E9; border:1px solid var(--line); border-radius:6px; padding:8px 10px; font-size:14px; margin-top:8px;}
  .backbtn{margin:0 0 10px; padding:8px 14px; border:1.5px solid var(--ink); background:#fff; border-radius:8px; font-weight:700;}
  .bigbtn{float:right; margin-bottom:10px; padding:8px 14px; border:1.5px solid var(--line); background:#fff; border-radius:8px; font-weight:700; color:var(--muted);}
  /* log form */
  .fs{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px;}
  .fs h3{margin:0 0 4px; font-size:13px; letter-spacing:.12em; color:var(--muted);}
  .fs .why{font-size:12.5px; color:var(--muted); margin-bottom:8px;}
  label.f{display:block; font-size:13px; font-weight:700; margin:12px 0 4px;}
  label.f .hint{font-weight:400; color:var(--muted);}
  input[type=text],input[type=number],input[type=date],textarea{
    width:100%; padding:9px 10px; border:1.5px solid var(--line); border-radius:8px; font-size:16px; background:#fff;}
  textarea{min-height:64px;}
  .row2{display:flex; gap:10px;} .row2>*{flex:1;}
  .req{color:var(--alert);}
  .cardlog{border:1.5px solid var(--line); border-radius:10px; padding:12px; margin-top:12px;}
  .cardlog .hd{display:flex; align-items:center; gap:8px; font-weight:800;}
  .cardlog .hd .dot{width:10px;height:10px;border-radius:5px;}
  .ckline{display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap;}
  .ckline .lb{flex:1 1 100%; font-size:14px;}
  .ckline input[type=number]{width:64px;}
  .ckline .of{color:var(--muted); font-weight:700;}
  .warn{color:var(--alert); font-weight:700; font-size:14px; margin-top:8px;}
  .export{background:#fff; border:1.5px solid var(--ink); border-radius:10px; padding:12px; margin-top:14px;}
  pre{white-space:pre-wrap; font-size:13px; background:var(--bg); padding:10px; border-radius:8px; max-height:340px; overflow:auto;}
  .go{width:100%; padding:14px; font-size:17px; font-weight:800; color:#fff; background:var(--ink); border:0; border-radius:10px;}
  .copy{width:100%; padding:12px; font-size:15px; font-weight:700; border:1.5px solid var(--ink); background:#fff; border-radius:10px; margin-top:8px;}
  .missing{background:#FDF0EE; border:1px solid var(--alert); border-radius:8px; padding:10px; margin-top:10px; font-size:14px;}
  .subtle{font-size:12.5px; color:var(--muted); text-align:center; margin-top:18px;}
</style>
</head>
<body>
<header><span class="t">REBA</span><span class="b" id="bstamp"></span></header>
<nav>
  <button id="tabCards" class="on" onclick="tab('cards')">CARDS</button>
  <button id="tabLog" onclick="tab('log')">LOG</button>
</nav>
<main>
  <div id="jsnote" style="background:#FDF0EE;border:1px solid #A32E1E;border-radius:8px;padding:12px;font-size:14px;line-height:1.5">
    <b>If you can read this, this viewer is not running the app.</b> File previews
    (Claude, Files, Mail) show the page but block scripts. Open it in Safari instead:
    save the file to Files, long-press it, Share, choose <b>Safari</b>. Once the cards
    appear, tap Share &rarr; <b>Add to Home Screen</b>.
  </div>
  <div id="vCards"></div>
  <div id="vLog" style="display:none"></div>
</main>
<script>
document.getElementById('jsnote').remove();
window.onerror = function(msg, src, line){
  var d = document.createElement('div');
  d.style.cssText = 'background:#FDF0EE;border:1px solid #A32E1E;border-radius:8px;padding:10px;margin:10px;font-size:13px';
  d.textContent = 'App error (screenshot this): ' + msg + ' @' + line;
  document.body.insertBefore(d, document.body.querySelector('main'));
};
</script>
<script>
const DECK = {"build": "08-09·91f", "version": "2026-08-09", "dog": "Reba", "palette": {"green": "#2F4A32", "rust": "#8C3B2A", "tan": "#9A7C42", "slate": "#3F5A6B", "clay": "#7A5240", "alert": "#A32E1E", "gray": "#F3F2EE", "line": "#C6C2B6", "ink": "#232720", "muted": "#6B6F64"}, "cards": [{"code": "MK-T", "track": "MK", "trackName": "Steadiness & Marking", "color": "#2F4A32", "type": "title", "n": null, "title": "Steadiness in Marking Drills", "drill": "", "pass": "", "body": "Marks and steadiness pull against each other. Buy steadiness by\npreventing the break, not punishing it. Marking desire comes first —\nnever trade it away. Add difficulty on one axis at a time; keep the mark\nitself easy whenever steadiness is the thing being tested.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": null, "blocked_note": null}, {"code": "MK-1", "track": "MK", "trackName": "Steadiness & Marking", "color": "#2F4A32", "type": "stage", "n": 1, "title": "Held Hold on Singles", "drill": "Short tab or lead at heel, or foot on the lead so hands are free. Throw an\neasy short single. Hold her sitting through the fall, pause 1–2 sec, release\nwith her name. The lead does the enforcing, not you — a break should be\nmechanically impossible.\n", "pass": "Holds through the fall with slack in the lead, not straining against it, across\n~10 reps and 2–3 sessions. The hold feels automatic before you ask for it\nwithout restraint.\n", "body": "", "ifthen": [["Straining against the lead", "Mark is too exciting. Shorten the throw, cut the delay to zero, rebuild."], ["You find yourself correcting", "Go back to foot-on-lead. At this stage you prevent, you do not correct."]], "checks": [{"id": "c1", "label": "Holds through the fall, slack in the lead", "hits": 10, "of": 10, "sessions": 3}], "session_cap": null, "equipment": [], "requires": [], "trigger": null, "blocked_note": null}, {"code": "MK-2", "track": "MK", "trackName": "Steadiness & Marking", "color": "#2F4A32", "type": "stage", "n": 2, "title": "Release Delay", "drill": "Same easy single, still managed. Stretch the pause from 1–2 sec toward\n5–10+. Vary the timing every rep. Occasionally hold and pick the bumper up\nyourself (no-bird) — sparingly. She releases to her name, not to the throw.\n", "pass": "Sits quietly through delays up to 8–10 sec — no whining, creeping, or\nanticipating — and does not flinch toward a no-bird.\n", "body": "", "ifthen": [["Creeps as the delay stretches", "The delay grew on a schedule she can read. Randomize: 2 sec, 9 sec, 3 sec, 6 sec."], ["Sours on no-birds", "You are using them too often. One rep in eight at the very most."], ["Return goes wide, or she parades", "Off-axis for this stage, but it will not fix itself. See The Parading Return."]], "checks": [{"id": "c1", "label": "Quiet through randomized 8-10 sec delays", "hits": 8, "of": 10, "sessions": 2}, {"id": "c2", "label": "No flinch toward a no-bird", "hits": 3, "of": 3}], "session_cap": null, "equipment": [], "requires": ["steadiness.s1"], "trigger": null, "blocked_note": null}, {"code": "MK-3", "track": "MK", "trackName": "Steadiness & Marking", "color": "#2F4A32", "type": "stage", "n": 3, "title": "Add Excitement — Noise Ladder", "drill": "Prereq: Marks 2 PASS and an honest return. Light (green) loads, low angle. Tube geometry: see Solo Launcher Sessions. FIVE rungs, one at a time; each new noise resets the delay to 2 sec. 1. A gun throws, no shot. 2. Remote launch. 3. Add the beep 1–2 sec ahead. 4. Popper at the line, a gun throws. 5. Handheld at the line. The beep drops at rung 4. One rep in five is a shot with NO SEND. On lead all stage.\n", "pass": "1. 6/6 at 2 sec, x2. 2. 8/10 at randomized 8–10 sec. 3. 8/10 with the beep, back to 8 sec. 4. 8/10 with the popper. 5. 8/10 with the handheld, x2. Six loud reps a session, max.\n", "body": "", "ifthen": [["Breaks when a new noise is added", "You stacked two. Pull the new one, re-establish, add it back alone at 2 sec."], ["Creeps or whines watching the tube", "The tube has become the cue. Not enough no-send reps — go to one in four."], ["Flinches or checks out at the report", "Stop. Do not push through. Tube to 100+ yds, happy retrieves only, rebuild over weeks."]], "checks": [{"id": "r1", "label": "A gun throws, no shot, 2 sec delay", "hits": 6, "of": 6, "sessions": 2, "needs_helper": true}, {"id": "r2", "label": "Remote launch, randomized 8-10 sec delay", "hits": 8, "of": 10}, {"id": "r3", "label": "Beep added, delay back to 8 sec", "hits": 8, "of": 10}, {"id": "r4", "label": "Popper at the line, a gun throws", "hits": 8, "of": 10, "needs_helper": true}, {"id": "r5", "label": "Handheld launcher at the line", "hits": 8, "of": 10, "sessions": 2}], "session_cap": {"reps": 6, "applies_to": "launcher and popper reps", "note": "Six loud reps a session, maximum. Thrown-bumper reps are not capped."}, "equipment": ["lead", "bumpers", "sidekick", "light_loads", "beeper", "poppers_12ga", "handheld_launcher"], "requires": ["steadiness.s2"], "trigger": null, "blocked_note": "Rungs 1 and 4 need a GUN in the field — a second person. Rungs 2, 3 and 5 run solo."}, {"code": "MK-4", "track": "MK", "trackName": "Steadiness & Marking", "color": "#2F4A32", "type": "stage", "n": 4, "title": "Wean the Lead", "drill": "Drop the lead but keep a tab on and stay close enough to intercept. Start\nback at short delay plus easy mark, then rebuild delay and excitement off\nlead. You are transferring the hold from mechanical restraint to a chosen sit.\n", "pass": "Multiple clean sessions of off-lead singles — steady through fall, delay, and\ngun — with no break and no need to touch the tab.\n", "body": "", "ifthen": [["Breaks the moment the lead comes off", "She was holding the lead, not the sit. Back to Stage 1, foot on lead, for a week. See If She Breaks."], ["You keep reaching for the tab", "You moved into the stage too early. Stand closer — do not hold tighter."]], "checks": [{"id": "c1", "label": "Off-lead single, steady through fall/delay/gun", "hits": 10, "of": 10, "sessions": 3}], "session_cap": null, "equipment": [], "requires": ["steadiness.s3"], "trigger": null, "blocked_note": null}, {"code": "MK-5", "track": "MK", "trackName": "Steadiness & Marking", "color": "#2F4A32", "type": "stage", "n": 5, "title": "Harder / Longer Marks", "drill": "Only now do you make the retrieve itself demanding, with steadiness already\nbanked. Add distance, cover, angles, terrain — one axis at a time. Cover means\nthe cover you hunt: standing timber, open-water bank, short grass. Cross Lake's\ncypress is the timber picture. You do not hunt marsh, so do not manufacture it.\n", "pass": "Steady on long and challenging singles, and marking them well. Drive and\nsteadiness both intact.\n", "body": "", "ifthen": [["Steadiness wobbles as marks get hard", "Drop the mark difficulty back down. Do not crank corrections to hold the line."], ["Hunting short, poor marks", "You added two axes at once. Distance or cover, not both in the same session."]], "checks": [{"id": "c1", "label": "Steady on long or cover singles, marking well", "hits": 8, "of": 10, "sessions": 2}], "session_cap": null, "equipment": [], "requires": ["steadiness.s4"], "trigger": null, "blocked_note": null}, {"code": "MK-6", "track": "MK", "trackName": "Steadiness & Marking", "color": "#2F4A32", "type": "stage", "n": 6, "title": "Doubles on Lead", "drill": "Lead back on. Mark the memory bird, HOLD; mark the go-bird, HOLD; release by\nname for the go-bird; then send back for the memory. Physical management\nthrough both falls. The second throw is the single biggest break trigger there is.\n", "pass": "Holds cleanly through both throws, on lead, until the pattern is boring. No\nlunge on the second fall.\n", "body": "", "ifthen": [["Lunges on the second throw", "Widen the two falls and lengthen the gap between them. Narrow it again later."], ["Forgets the memory bird", "Steadiness is eating her marking. Make the memory bird closer and easier."]], "checks": [{"id": "c1", "label": "On-lead double, holds through both throws", "hits": 8, "of": 10, "sessions": 2}], "session_cap": null, "equipment": [], "requires": ["steadiness.s5"], "trigger": null, "blocked_note": null}, {"code": "MK-7", "track": "MK", "trackName": "Steadiness & Marking", "color": "#2F4A32", "type": "stage", "n": 7, "title": "Doubles Off Lead", "drill": "Wean the lead on doubles exactly as you did on singles — tab on, stay close,\nrebuild. This is the finished picture, and it is a maintenance skill, not a\ncompleted one.\n", "pass": "Consistent off-lead doubles, steady through both throws and the gun, marking\nboth birds.\n", "body": "", "ifthen": [["Switching between birds", "Back to on-lead doubles with wider separation between the falls."], ["Steady but slow", "Read the over-suppression card. Pull steadiness work for a week and run happy marks."]], "checks": [{"id": "c1", "label": "Off-lead double, steady through both throws and gun", "hits": 8, "of": 10, "sessions": 3}], "session_cap": null, "equipment": [], "requires": ["steadiness.s6"], "trigger": null, "blocked_note": null}, {"code": "MK-R1", "track": "MK", "trackName": "Steadiness & Marking", "color": "#2F4A32", "type": "reference", "n": null, "title": "If She Breaks", "drill": "", "pass": "", "body": "1. Ideal: she never does, because you managed it.\n2. Stop her with the tab. Walk her back to the exact spot. Reset.\n3. Re-throw or have the thrower pick it up — the break earns nothing.\n4. The lesson is simple and it is the only lesson: breaking = no retrieve.\n5. Save the e-collar nick-on-sit for a clear, deliberate break once the rule is\nplainly understood. Do not hammer a green dog at the line.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": "failure", "blocked_note": null}, {"code": "MK-R2", "track": "MK", "trackName": "Steadiness & Marking", "color": "#2F4A32", "type": "reference", "n": null, "title": "Over-Suppression — Back Off", "drill": "", "pass": "", "body": "Warning signs: going slow off the line or no-going · popping (stopping to look\nback for direction) · glancing back at you before the send · sticky or reluctant\nreleases.\n\nFix: fewer corrections. Throw fun free-for-all bumpers to rebuild drive.\nRe-introduce steadiness gentler. Marking desire first, always. A slow dog is a\nfar more expensive problem than a dog that breaks.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": "failure", "blocked_note": null}, {"code": "MK-R3", "track": "MK", "trackName": "Steadiness & Marking", "color": "#2F4A32", "type": "reference", "n": null, "title": "Solo Launcher Sessions", "drill": "", "pass": "", "body": "Anchor her so the break is prevented mechanically: place board, stake-out chain,\nor lead under your foot. Anchor → launch → HOLD → release by name. The place\nboard helps most: leaving it is an obvious, enforceable event.\n\nTube placement. Perpendicular to her running line, throwing across it. Never\naimed at the dog, at you, or across ground you will walk. What matters is\ntube-to-FALL, not tube-to-dog: a light load carries ~50 yds alone, so a tube at\n50 yds throwing flat gives a 70 yd mark. Lower the angle or move the tube in.\n\nSame side, same direction for the whole of Marks 3 — the excitement is the new\nvariable, not the geometry. Light green loads while steadiness is being built.\nNever dry fire a hand launcher: the dummy absorbs the charge. No dummy, no shot.\n\nSun behind her, wind quartering to her. Where they fight, take the sun — she has\nto SEE the fall, and a tailwind only costs scent on a mark she watched down.\nWind wins later, on blinds. The sunset bearing swings 40°+ from August to November.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": "prerequisite", "blocked_note": null}, {"code": "MK-R4", "track": "MK", "trackName": "Steadiness & Marking", "color": "#2F4A32", "type": "reference", "n": null, "title": "The Parading Return", "drill": "", "pass": "", "body": "Parading is a recall problem with a bumper in her mouth, not a hold problem. Force fetch bought\npick-up, hold and out, never the path home; every lap pays her in possession.\n\nDiagnose. One consistent side is handler position or habit; either side is attitude. Stand still, do not\nreach — if she straightens, it was you.\n\nPrevent, do not correct. 50 ft cord on the ground at the distance where the return is honest. Keep it\nslack — block the loop, never reel her in, or she learns to wait for the pull. Move away as she returns.\nDrop the platform ritual until she is straight. No collar on the return: pressure plus possession buys a\nspat bumper or a slow return. Pay every clean rep; thin treats only after she passes.\n\nFade ladder. 1. Corridor, fenced both sides, cord dragging untouched. 2. Same corridor, line off-centre\nand lengthened so the last 10 yds fall outside the fence. 3. Open ground, one feature on her arcing\nside — Lines 1's picture, so the rep serves both tracks. 4. Open ground, no feature, cord dragging.\n\nPASS is measured at rung 4 only: 9/10 straight to hand, cord dragging untouched, two sessions.\nRungs 1–3 are logged and do not count. Assisted reps are the training, not the test.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": "failure", "blocked_note": null}, {"code": "MK-R5", "track": "MK", "trackName": "Steadiness & Marking", "color": "#2F4A32", "type": "reference", "n": null, "title": "The Fun Rep", "drill": "", "pass": "", "body": "The fun bumper is the period at the end of the session — the no-pressure rep the\nstanding rules require. Her desire is not the problem, so this is not medicine;\nit is a ritual. Rationed and rules-lite, never rule-free.\n\nOne or two, never more. Announce it with its own release word, never a working\ncommand. Throw short, easy, seen, into open ground. Steadiness is waived —\nbreaking on the throw IS the fun.\n\nOne rule survives: the bumper still ends in your hand. No front sit, no\nformality. As she picks up, turn and walk toward the truck; she catches up\ncarrying and you take it at your side without reaching — or let her carry at\nheel the whole way. Possession WITH you pays what she wants, in your direction.\n\nNever chase, reach, or play keep-away. Never tug — possession is her fault\nline. If she parades: no correction, no second bumper. The game simply ends.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": "browse", "blocked_note": null}, {"code": "WH-T", "track": "WH", "trackName": "Whistle Sit → Casting", "color": "#8C3B2A", "type": "title", "n": null, "title": "Whistle Sit → Casting", "drill": "", "pass": "", "body": "The one hard rule. The whistle never enters the bird picture until Stage 4 is\nfinished. No whistle on a return from a mark. No whistle on a dog driving to a\nfall. Whistle work lives on bare ground with piles and bumpers — no thrown marks,\nno flyers.\n\nSession 10–15 min, 2–3×/week, always after marking work. Never\ncollar-condition sit on a force-to-pile day. Never end on a pressure rep. If\nmarking goes sideways, skip Whistle work entirely that day.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": null, "blocked_note": null}, {"code": "WH-1", "track": "WH", "trackName": "Whistle Sit → Casting", "color": "#8C3B2A", "type": "stage", "n": 1, "title": "Whistle Sit at Heel, On Lead", "drill": "One short blast. Butt hits the ground on the sound, not after it. Head comes up,\neyes find you. Walk, sit, release with a verbal. Then trot, sit, release. Both\ndirections.\n", "pass": "10/10 clean across three consecutive sessions, from a walk and from a trot,\nboth directions. Zero forward creep after the sit.\n", "body": "", "ifthen": [["Sits late, after a beat", "Your lead pop is too slow. Pop the instant the whistle sounds, not after she ignores it."], ["Creeps forward on the sit", "Heel her TOWARD a wall or fence and blast a stride short of it — the creep has nowhere to go. Re-sit every creep, no scolding."], ["Looks away after sitting", "Not a pressure fix yet. Step in, get the eyes with a hand at your chest, release."]], "checks": [{"id": "c1", "label": "Butt on the sound, from a walk and from a trot", "hits": 10, "of": 10, "sessions": 3}], "session_cap": null, "equipment": [], "requires": [], "trigger": null, "blocked_note": null}, {"code": "WH-2", "track": "WH", "trackName": "Whistle Sit → Casting", "color": "#8C3B2A", "type": "stage", "n": 2, "title": "Off Lead: Sit in Motion, Stop at Distance", "drill": "Prereq: Whistle 1 PASS. Momentum is the variable, not distance. Four\nsteps, in order. 1. Heel off lead, one blast, she plants — KEEP WALKING 10+\nsteps, no pause. 2. Remote stay: back to 10→20→30→40 yds. 3. The stop — loose\nand moving, no bumper, no pile — per Teaching the Stop in Motion. 4. Stop on\nrecall at ~15 yds.\n", "pass": "1. 10/10 both directions through 10 steps. 2. 5/5 at 40 yds, 30-sec hold, zero\ncreep. 3. 9/10 first-whistle stops at 40 in motion, two sessions, slide under\none body length. 4. 5/5 at 15 yds. Step 3 is the money skill.\n", "body": "", "ifthen": [["Stays in 2, busts the stop in 3", "A stay is not a stop. Drop to 10 yds in motion and re-climb."], ["Ignores the whistle at distance", "Halve the distance. Never re-blow. See If She Blows the Whistle."], ["Recall slows, or creeps in watching", "Stop drilled into recall. Max 3 stops a session; end on 2 free recalls."], ["Slides past a body length", "See Teaching the Stop in Motion."]], "checks": [{"id": "r1", "label": "Heel off lead, holds through 10 steps", "hits": 10, "of": 10}, {"id": "r2", "label": "Remote stay at 40 yds, 30 sec hold", "hits": 5, "of": 5}, {"id": "r3", "label": "First-whistle stop at 40 yds in motion", "hits": 9, "of": 10, "sessions": 2}, {"id": "r4", "label": "Stop on recall at 15 yds", "hits": 5, "of": 5}], "session_cap": null, "equipment": [], "requires": ["whistle.s1"], "trigger": null, "blocked_note": null}, {"code": "WH-3", "track": "WH", "trackName": "Whistle Sit → Casting", "color": "#8C3B2A", "type": "stage", "n": 3, "title": "Sit and Look at Me", "drill": "On a place board at 10 yds, sit her facing you. Square is taught by resetting,\nnot repeating: if the hip cocks, step one pace sideways — she must re-rotate to\nface you — and pay only the square sit. Eye contact is paid from the front: mark\nthe instant her eyes find yours, treat at nose height. Climb 10→20→30 yds, then\nstretch the hold to 10 sec. End state: squared, facing, eyes held until you cast\nor release. A crooked or scanning dog cannot take a cast. Non-negotiable before\nany casting work.\n", "pass": "Square, facing, eyes locked, holding through a 10-second pause at 30 yards.\n", "body": "", "ifthen": [["Sits crooked, hip cocked", "She cannot cast left off a cocked right hip. Reset until it is square every single rep."], ["Eyes drift to the pile", "Pattern-guessing. Pause longer so the cast, not the pile, becomes the cue."], ["Fidgets and re-adjusts", "Shorten the hold, build back up. A fidgety sit becomes a break under bird pressure."]], "checks": [{"id": "c1", "label": "Square, facing, eyes locked through 10 sec at 30 yds", "hits": 9, "of": 10, "sessions": 2}], "session_cap": null, "equipment": [], "requires": ["whistle.s2"], "trigger": null, "blocked_note": null}, {"code": "WH-4", "track": "WH", "trackName": "Whistle Sit → Casting", "color": "#8C3B2A", "type": "stage", "n": 4, "title": "Collar-Condition the Sit", "drill": "Indirect pressure only. Momentary nick simultaneous with the whistle — not\nbefore, not after — on a command she already knows cold. Garmin Sport PRO:\nstart at the lowest level she acknowledges (a flick of the ear, not a yelp) and\nraise only if she ignores.\n", "pass": "Sits on the whistle at all distances with the collar on and with it off. No\nhesitation, no anticipation of the nick.\n", "body": "", "ifthen": [["Yelps or shuts down", "Level too high. Drop it now, return to Stage 1 on lead, rebuild trust before retrying."], ["Sits before the whistle", "Reading your body, not the sound. Vary posture and timing; whistle from odd positions."], ["Sticky or slow on retrieves", "You stacked pressure. Pull Whistle work for a week, run happy marks. See Over-Suppression."]], "checks": [{"id": "c1", "label": "Sits on the whistle at all distances, collar on", "hits": 10, "of": 10, "sessions": 2}, {"id": "c2", "label": "Same with the collar off", "hits": 10, "of": 10, "sessions": 2}], "session_cap": null, "equipment": [], "requires": ["whistle.s3"], "trigger": null, "blocked_note": null}, {"code": "WH-5", "track": "WH", "trackName": "Whistle Sit → Casting", "color": "#8C3B2A", "type": "stage", "n": 5, "title": "Baseball — Three-Handed Casting", "drill": "Dog on the mound, three piles at 15 yds (left, right, back). Teach back first —\nit is the natural direction and the one she already wants. Then overs, one side\nat a time. Then mix. Angle backs come last.\n", "pass": "Clean singles on back, left over, and right over. Takes the cast on the first\nsignal — no re-cast, no self-selecting a pile.\n", "body": "", "ifthen": [["Takes the wrong pile", "She is guessing. Stop mixing. Ten straight reps of the failing cast, then reintroduce choice. See Naming Casts."], ["Won't leave on 'back'", "The pile is not established. Walk her to it, throw a bumper into it, restart at 5 yds."], ["Spins before casting", "The sit is not square. That is a Stage 3 failure — go back one card."]], "checks": [{"id": "c1", "label": "Back, first signal", "hits": 9, "of": 10}, {"id": "c2", "label": "Left over, first signal", "hits": 9, "of": 10}, {"id": "c3", "label": "Right over, first signal", "hits": 9, "of": 10}, {"id": "c4", "label": "Mixed casts, no self-selecting", "hits": 8, "of": 10, "sessions": 2}], "session_cap": null, "equipment": [], "requires": ["whistle.s4"], "trigger": null, "blocked_note": null}, {"code": "WH-6", "track": "WH", "trackName": "Whistle Sit → Casting", "color": "#8C3B2A", "type": "stage", "n": 6, "title": "Single T → Double T", "drill": "Casting transfers off the diamond onto a lining pattern. Single T: one pile\nstraight back, two side piles at the crossbar. Whistle-sit her midway, cast.\nDouble T adds a second crossbar to build distance discipline.\n", "pass": "Runs the pattern at distance, stops on a single whistle mid-run, takes any of\nthree casts cleanly and repeatedly.\n", "body": "", "ifthen": [["Popping (stops and looks back uncast)", "You over-handled. Let her run more lines without stopping her. Expensive to fix — catch it early."], ["Veers off the line to the back pile", "Suction from a side pile. Re-run the back line alone until it is a highway."], ["Slows at the crossbar", "She is anticipating a stop. Run several reps with no whistle at all."]], "checks": [{"id": "c1", "label": "Single T: stop mid-run, three casts clean", "hits": 8, "of": 10, "sessions": 2}, {"id": "c2", "label": "Double T at distance", "hits": 8, "of": 10, "sessions": 2}], "session_cap": null, "equipment": [], "requires": ["whistle.s5"], "trigger": null, "blocked_note": null}, {"code": "WH-7", "track": "WH", "trackName": "Whistle Sit → Casting", "color": "#8C3B2A", "type": "stage", "n": 7, "title": "Convergence — Whistle Meets Birds", "drill": "Only now does the whistle rejoin the bird picture, and only as steadiness\ninsurance: sit on the line, sit after the retrieve, sit to honor. Still not a stop on\na return from a mark. Handling on blinds is Phase 3 — well past double T.\n", "pass": "Whistle sit holds under bird pressure at the line without slowing her drive to\nthe fall or her return.\n", "body": "", "ifthen": [["Delivery gets slow after convergence", "Immediate red flag. Pull the whistle out of the bird picture for two weeks. Happy marks only."], ["Won't sit at the line with a bird out", "Bird pressure exceeds her training level. Dead bumpers, then frozen ducks, then flyers."], ["Anticipates the whistle, self-sits", "Over-drilled. More free retrieves, fewer reps."]], "checks": [{"id": "c1", "label": "Whistle sit at the line under bird pressure, no loss of drive", "hits": 9, "of": 10, "sessions": 3}], "session_cap": null, "equipment": [], "requires": ["whistle.s6", "steadiness.s4"], "trigger": null, "blocked_note": null}, {"code": "WH-R1", "track": "WH", "trackName": "Whistle Sit → Casting", "color": "#8C3B2A", "type": "reference", "n": null, "title": "If She Blows the Whistle", "drill": "", "pass": "", "body": "1. No emotion. Do not yell. A whistle refusal punished in anger becomes a\nwhistle the dog dreads.\n2. Go get her. Walk out, take her collar, place her back on the exact spot where\nthe whistle sounded. Silence the whole way.\n3. Re-sit, hold, release. Then run the same setup at a difficulty she can win.\n4. Never re-blow. One whistle. If she ignores it you enforce — you do not\nrepeat. A repeated whistle teaches that the first one is optional.\n5. Two failures in a row = drop a stage. Not a discipline problem. A\ntraining-level problem.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": "failure", "blocked_note": null}, {"code": "WH-R2", "track": "WH", "trackName": "Whistle Sit → Casting", "color": "#8C3B2A", "type": "reference", "n": null, "title": "Working Solo", "drill": "", "pass": "", "body": "• Piles beat throws. Stages 5–6 are built entirely on stationary piles — which is\nexactly why they work without a helper.\n• A remote launcher helps Marks work, but it is not needed for Whistle work at all.\nDo not wait on hardware to start whistle sit.\n• Use a longer lead than you think you need for Stage 2. Twenty feet of check\ncord is worth more than a helper.\n• Stake or flag your piles. Consistent pile locations are the single biggest\npredictor of clean casting.\n• Before Whistle 4, walking out and placing her is your only enforcement. That walk is\nwhat caps your working distance in Stage 2 — not her ability.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": "browse", "blocked_note": null}, {"code": "WH-R3", "track": "WH", "trackName": "Whistle Sit → Casting", "color": "#8C3B2A", "type": "reference", "n": null, "title": "Teaching the Stop in Motion", "drill": "", "pass": "", "body": "Read before Whistle 2 step 3. The stop is built WITH her, not sprung on\nher. Walk together off heel, blow once mid-stride, and KEEP MOVING — she must\nkey on the whistle, not on you stopping. The commonest handler mistake is the\npause: pause at the blast and the pause becomes the cue, and the whistle stays\nempty. Climb SPEED before DISTANCE — walk, trot, loose run, each clean before\nthe next — then stretch 10→20→30→40 yds. After the plant, WALK TO HER and pay\nat the spot she stopped. Never recall off a stop while it is being built: the\nstop decays into a slow creep-in. Measure the slide against a line on the\nground — a football field's 5-yd marks are ideal. Pay behind the line she\nplanted on, never ahead of it. If the slide grows past a body length, drop one\nspeed class and re-climb. PASS lives on Whistle 2: 9/10\nfirst-whistle stops at 40 in motion, slide under one body length, two sessions.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": "prerequisite", "blocked_note": null}, {"code": "WH-G", "track": "WH", "trackName": "Whistle Sit → Casting", "color": "#8C3B2A", "type": "gate", "n": null, "title": "Convergence Gate — Do Not Skip", "drill": "", "pass": "", "body": "Marks work and Whistle work stay physically and temporally separate until Stage 4 is\ncomplete and holding for at least two weeks.\n\nIf you find yourself wanting to blow the whistle at a marking dog before then,\nthe answer is no.\n\nEvery trainer worth listening to on this — King, Standing Stone, Lone Duck —\nsays the same thing: a whistle used to fix a marking problem creates a handling\nproblem that outlives the marking problem.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": null, "blocked_note": null}, {"code": "LN-T", "track": "LN", "trackName": "Lining & Blinds", "color": "#9A7C42", "type": "title", "n": null, "title": "Lining & Blinds", "drill": "", "pass": "", "body": "Stages 1–5 need no whistle, no casts, no handling — they are line mechanics\nand can start today. Stages 6–7 are blinds and are locked behind Whistle work single\nT. A dog that cannot be stopped at distance cannot be corrected on a blind.\n\nAdapted from Adem Fehmi (Dog-ease, Hertfordshire). Resequenced for a\ncollar-conditioned US program — commands, gating, and correction model are\nnot his.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": null, "blocked_note": null}, {"code": "LN-1", "track": "LN", "trackName": "Lining & Blinds", "color": "#9A7C42", "type": "stage", "n": 1, "title": "Backstop Line", "drill": "Levee crown, treeline, fence, or canal bank as a backstop. Dummy thrown\n20–30 yds parallel to the feature, dog at heel, wind in her face. Line her up,\nsend with back. She has seen the fall.\n", "pass": "5 of 5 out and back with no arc off the feature, clean delivery to hand.\n", "body": "", "ifthen": [["Arcs away from the feature", "Move closer to it. The feature must be within a few feet of her line, not a distant landmark."], ["Hunts short", "The throw is too long for the ground. Shorten until the line is a highway, then stretch."], ["Wide or slow coming back", "PASS needs a clean delivery, not just a clean outrun. See The Parading Return in Marks."]], "checks": [{"id": "c1", "label": "Out and back, no arc, clean delivery", "hits": 5, "of": 5}], "session_cap": null, "equipment": [], "requires": [], "trigger": null, "blocked_note": null}, {"code": "LN-2", "track": "LN", "trackName": "Lining & Blinds", "color": "#9A7C42", "type": "stage", "n": 2, "title": "Both Directions", "drill": "Same ground, same backstop. Alternate throws left and right of your position,\nre-heeling and re-lining her every rep. The line must come from how you set her\nup, not from a habit.\n", "pass": "She sets up on your line each time without drifting toward the previous side.\n5 of 5 both ways.\n", "body": "", "ifthen": [["Pre-loads on one side", "Run three in a row on the weak side, then reintroduce alternation."], ["Won't sit square to the line", "That is a Whistle 3 problem. Fix it there, not here."]], "checks": [{"id": "c1", "label": "Sets up on your line, alternating sides", "hits": 5, "of": 5}], "session_cap": null, "equipment": [], "requires": ["lining.s1"], "trigger": null, "blocked_note": null}, {"code": "LN-3", "track": "LN", "trackName": "Lining & Blinds", "color": "#9A7C42", "type": "stage", "n": 3, "title": "Distance & Wind", "drill": "Same ground stretched to 50–70 yds, throw into the wind. Change your start\npoint along the feature so the ground stays familiar and the picture does not.\n", "pass": "Straight line held at full distance. No hunting short, no swinging wide of the\nfeature.\n", "body": "", "ifthen": [["Line falls apart past 40 yds", "Add ten yards at a time, not twenty. Back up to the last distance that held."], ["Overruns with wind at her back", "Reset to throwing into the wind until the line is reliable at that distance."], ["The feature runs out before the throw does", "The feature must be longer than the mark or the start point cannot move. Run 50 yds on a 60 yd feature; save 70 for longer ground."]], "checks": [{"id": "c1", "label": "Straight line held at 50-70 yds into the wind", "hits": 5, "of": 5, "sessions": 2}], "session_cap": null, "equipment": [], "requires": ["lining.s2"], "trigger": null, "blocked_note": null}, {"code": "LN-4", "track": "LN", "trackName": "Lining & Blinds", "color": "#9A7C42", "type": "stage", "n": 4, "title": "Memory Retrieve", "drill": "Lead on. Walk her to heel down the backstop, plant the dummy, let her mark it,\nthen about turn AWAY from the plant — never across her line to it. Heeling on\nthe left, that is a right about turn. Walk back, sit, lead off, send.\n", "pass": "Clean send and straight line on a planted dummy at 40+ yds, with no creeping\nwhile you walk back. 5/5, two sessions.\n", "body": "", "ifthen": [["Creeps while you walk back", "Lead stays on and under your foot. This is a Marks 1 picture — treat it as one."], ["Forgets the fall", "Shorten the walk-back and let her watch you plant it longer before you turn away."]], "checks": [{"id": "c1", "label": "Memory retrieve at 40+ yds, no creeping", "hits": 5, "of": 5, "sessions": 2}], "session_cap": null, "equipment": [], "requires": ["lining.s3"], "trigger": null, "blocked_note": null}, {"code": "LN-5", "track": "LN", "trackName": "Lining & Blinds", "color": "#9A7C42", "type": "stage", "n": 5, "title": "Honest Dog (Seen Diversion)", "drill": "Two dummies down, both seen. Send her for the far one. You walk out and pick\nthe near one yourself. Vary which one she gets so it never becomes a pattern.\nThis is the honor picture, trained without a blind.\n", "pass": "Takes the sent line past a visible diversion 4 of 5, and sits quiet while you\ncollect the other.\n", "body": "", "ifthen": [["Takes the diversion", "Widen the angle between the two and shorten the sent one until she wins, then rebuild."], ["Whines while you pick up", "Ignore it, finish, and release her on a different rep. Never send her for the one she whined at."]], "checks": [{"id": "c1", "label": "Takes the sent line past a visible diversion", "hits": 4, "of": 5}], "session_cap": null, "equipment": [], "requires": ["lining.s4"], "trigger": null, "blocked_note": null}, {"code": "LN-G", "track": "LN", "trackName": "Lining & Blinds", "color": "#9A7C42", "type": "gate", "n": null, "title": "GATE — Stop Here", "drill": "", "pass": "", "body": "Do not run Stages 6–7 until Whistle work is complete through single T.\n\nThat means: sit on a single whistle at distance, and left over, right over, and\nback taken cleanly off that stop.\n\nA dog that cannot be stopped at distance cannot be corrected on a blind.\nRunning blinds early is how you build a dog that takes a wrong line at full\nspeed, or a dog that pops. Until the gate is cleared, the next two cards are a\nroadmap — not a to-do list.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": null, "blocked_note": null}, {"code": "LN-6", "track": "LN", "trackName": "Lining & Blinds", "color": "#9A7C42", "type": "stage", "n": 6, "title": "Pattern Blind on Known Ground", "drill": "The same backstop you have used since Stage 1. Plant the dummy with her out\nof sight. Line her up, send. A wrong line gets a sit whistle and a recast — not a\nrecall, not a re-send.\n", "pass": "3 of 3 pattern blinds at 60–80 yds with no more than one handle each.\n", "body": "", "ifthen": [["Pops — stops and looks back uncast", "You over-handled. Run lines with no whistle before returning to blinds. See Over-Suppression."], ["No-go on the send", "She does not believe there is anything out there. Show her the plant for a few reps."]], "checks": [{"id": "c1", "label": "Pattern blind 60-80 yds, one handle or fewer", "hits": 3, "of": 3}], "session_cap": null, "equipment": [], "requires": ["lining.s5", "whistle.s6"], "trigger": null, "blocked_note": null}, {"code": "LN-7", "track": "LN", "trackName": "Lining & Blinds", "color": "#9A7C42", "type": "stage", "n": 7, "title": "Blind with Diversion", "drill": "Throw a diversion dummy she sees, off to one side. Send her for the blind on the\nfar side. You pick the diversion yourself. This is the shoot-day picture and the\ntest picture.\n", "pass": "Refuses the diversion and takes the blind line 3 of 4, with one handle or fewer.\n", "body": "", "ifthen": [["Suction to the diversion", "Increase the angle between them and shorten the blind. Rebuild from a rep she can win."], ["Handles well but slows down", "Reduce reps. Blinds are expensive. End early and end on a win."]], "checks": [{"id": "c1", "label": "Blind with diversion, one handle or fewer", "hits": 3, "of": 4}], "session_cap": null, "equipment": [], "requires": ["lining.s6"], "trigger": null, "blocked_note": null}, {"code": "LN-R1", "track": "LN", "trackName": "Lining & Blinds", "color": "#9A7C42", "type": "reference", "n": null, "title": "Naming Casts", "drill": "", "pass": "", "body": "Casts are named for your arm, not her body.\n\nA right over means your right arm goes out and she moves in that direction.\n\nThe source video muddles this repeatedly — calling the same dummy \"on my\nright\" and then \"a bit further on her left\" within one rep. Pick handler-side, say\nit out loud in every session, and never describe a cast from her point of view.\nThe moment you are handling a dog at eighty yards in wind is the wrong\nmoment to work out which side you meant.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": "prerequisite", "blocked_note": null}, {"code": "LN-R2", "track": "LN", "trackName": "Lining & Blinds", "color": "#9A7C42", "type": "reference", "n": null, "title": "What Not to Import", "drill": "", "pass": "", "body": "The verbal. Fehmi uses one word — \"get out\" — for both left and right and lets\nthe hand carry the meaning. Reba is on back / here / sit. Do not add a third\nverbal mid-foundation.\n\nThe sequencing. He runs blinds off nothing but good seen and memory\nretrieves. That works in a no-collar picking-up program with a pro reading the\ndog. It does not transfer here.\n\nThe correction model. His answer to a bad rep is to drop back a step — keep\nthat. But your answer to a wrong line after the gate is a whistle stop and a\nrecast.\n\nThe about turn. He turns left on the memory retrieve. Reba heels on the left, so\na left turn sweeps you acros /* ---------- session model (in memory only — export is the record) ---------- */
/* The program's clock is America/Chicago — not UTC, and not a fixed offset.
   toISOString() is UTC, so anything logged after 7pm CDT was stamped with
   TOMORROW'S date; that is how six decision-log lines ended up dated a day ahead
   and sorted above the corrections that superseded them. A hardcoded -5 would be
   worse: Central drops to CST on 1 Nov, two weeks before the season opens. Naming
   the zone lets the browser handle CDT/CST itself. */
function todayCentral(){
  return new Intl.DateTimeFormat('en-CA', {timeZone:'America/Chicago'}).format(new Date());
}
let S = {
  date: todayCentral(), tod:'',
  location:'', locOther:'', new_site:false, new_ground:false,

function tab(t){ state.tab=t;
  document.getElementById('tabCards').classList.toggle('on',t==='cards');
  document.getElementById('tabLog').classList.toggle('on',t==='log');

function esc(s){return (s??'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;');}

/* ------------------------------ CARDS TAB ------------------------------ */
function renderCards(){
  const v = document.getElementById('vCards');
  if(state.openCard){ v.innerHTML = cardDetail(DECK.cards.find(c=>c.code===state.openCard)); return; }
  let h = '<div class="chips">';
  h += `<button class="chip ${!state.trackFilter?'on':''}" style="${!state.trackFilter?'background:var(--ink)':''}" onclick="state.trackFilter=null;render()">ALL</button>`;
  for(const t of TRACKS)
    h += `<button class="chip ${state.trackFilter===t.tag?'on':''}" style="${state.trackFilter===t.tag?'background:'+t.color:''}" onclick="state.trackFilter='${t.tag}';render()">${t.tag}</button>`;
  h += '</div>';
  for(const c of DECK.cards){
    if(state.trackFilter && c.track!==state.trackFilter) continue;
    const ty = c.type==='stage'?'':(c.type==='gate'?'GATE':(c.type==='reference'?'REF':'TRACK'));
    h += `<div class="cardrow" onclick="state.openCard='${c.code}';render()">
      <div class="stripe" style="background:${c.type==='gate'?'var(--alert)':c.color}"></div>
      <div class="code">${c.code}</div><div class="ti">${esc(c.title)}</div><div class="ty">${ty}</div></div>`;
  }
  v.innerHTML = h;
}
function cardDetail(c){
  const accent = c.type==='gate' ? 'var(--alert)' : c.color;
  const list = DECK.cards.filter(x => !state.trackFilter || x.track===state.trackFilter);
  const i = list.findIndex(x => x.code===c.code);
  const prev = i > 0 ? list[i-1] : null;
  const next = i < list.length-1 ? list[i+1] : null;
  let h = `<button class="backbtn" onclick="state.openCard=null;render()">&larr; ${c.track}</button>`;
  if (prev) h += `<button class="backbtn" style="border-color:var(--line);color:var(--muted)" onclick="state.openCard='${prev.code}';render()">&lsaquo; ${prev.code}</button>`;
  if (next) h += `<button class="backbtn" onclick="state.openCard='${next.code}';render()">${next.code} &rsaquo;</button>`;
  h += `<button class="bigbtn" onclick="state.bigType=!state.bigType;render()">A${state.bigType?'a':'A'}</button>`;
  h += `<div class="detail ${state.bigType?'big':''}"><div class="head" style="background:${accent}">
        <div class="code">${c.code} · ${esc(c.trackName)}${c.trigger?' · '+esc(c.trigger):''}</div>
        <div class="title">${esc(c.title)}</div></div>`;
  if(c.body) h += `<div class="sec"><div class="txt">${esc(c.body.trim())}</div></div>`;
  if(c.drill) h += `<div class="sec"><h4>DRILL</h4><div class="txt">${esc(c.drill.trim())}</div></div>`;
  if(c.pass) h += `<div class="sec"><h4>PASS</h4><div class="txt">${esc(c.pass.trim())}</div></div>`;
  if(c.checks.length){
    h += `<div class="sec"><h4>CHECKS</h4>`;
    for(const k of c.checks)
      h += `<div class="checkrow"><span class="num">${k.hits}/${k.of}${k.sessions?' ×'+k.sessions+'s':''}</span><span>${esc(k.label)}</span></div>`;
    h += `</div>`;
  }
  if(c.ifthen.length){
    h += `<div class="sec"><h4>IF / THEN</h4>`;
    for(const r of c.ifthen) h += `<div class="ifrow"><div class="if">${esc(r[0])}</div><div>${esc(r[1])}</div></div>`;
    h += `</div>`;
  }
  if(c.session_cap || c.equipment.length || c.blocked_note){
    h += `<div class="sec">`;
    if(c.equipment.length) h += `<h4>EQUIPMENT</h4><div class="txt">${esc(c.equipment.join(' · '))}</div>`;
    if(c.session_cap) h += `<div class="capnote">CAP: ${esc(c.session_cap.note || (c.session_cap.reps+' reps max'))}</div>`;
    if(c.blocked_note) h += `<div class="capnote">${esc(c.blocked_note)}</div>`;
    h += `</div>`;
  }
  h += `</div>`;
  return h;
}

  h += `<div class="fs"><h3>1 · BEFORE — outing context</h3>
    <div class="why">Once per trip. Handler state is asked before, not after — after is rationalisation.</div>
    <div class="row2"><div><label class="f">Date <span class="hint">Central</span></label><input type="date" id="f_date" value="${S.date}"></div>
    <div><label class="f">Length <span class="hint">min</span></label><input type="number" id="f_len" value="${S.length_min}"></div></div>
    <label class="f">AM or PM <span class="req">*</span> <span class="hint">not pre-filled on purpose — a wrong default is worse than a blank</span></label>${chipset(TOD, S.tod, 'setTOD')}
    <label class="f">Location</label>${chipset(LOCS, S.location, 'setLoc')}
    ${S.location==='Other'?`<input type="text" id="f_loco" placeholder="where" value="${esc(S.locOther)}">`:''}
    <label class="f">New to whom? <span class="hint">site = new place for you · ground = new footing/area for HER</span></label>
    <div class="chips">${toggleChip(S.new_site,'new SITE','tSite')}${toggleChip(S.new_ground,'new GROUND','tGround')}</div>
    <div class="row2"><div><label class="f">Air temp °F</label><input type="number" id="f_temp" value="${S.temp_f}"></div>
    <div><label class="f">Handler state <span class="req">*</span></label>${chipset(HSTATE, S.handler_state, 'setHS')}</div></div>
    <div class="chips">${toggleChip(S.helper,'helper','tHelper')}${toggleChip(S.birds,'birds','tBirds')}</div>
  </div>`;

  h += `<div class="fs"><h3>2 · CARDS RUN — counts first</h3>
    <div class="why">Counts anchor before any summary. Chips below are generated from tracks.yaml build ${DECK.build} — never hand-written.</div>
    <div class="chips">` +
    DECK.cards.filter(c=>c.type==='stage'||c.type==='reference').map(c=>
      `<button class="chip ${S.cards[c.code]?'on':''}" style="${S.cards[c.code]?'background:'+c.color:''}" onclick="tCard('${c.code}')">${c.code}</button>`).join('') +
    `</div>`;

  for(const code of Object.keys(S.cards)){
    const c = DECK.cards.find(x=>x.code===code); const cs = S.cards[code];
    h += `<div class="cardlog"><div class="hd"><span class="dot" style="background:${c.color}"></span>${code} · ${esc(c.title)}</div>`;
    if(c.session_cap) h += `<div class="capnote">CAP: ${esc(c.session_cap.note || (c.session_cap.reps+' reps max'))}</div>`;
    if(c.checks.length){
      h += `<label class="f">Checks attempted <span class="hint">tap to add — hits required for each</span></label>`;
      for(const k of c.checks){
        const on = cs.checks[k.id];
        h += `<div class="ckline">
          <button class="chip ${on?'on':''}" style="${on?'background:'+c.color:''}" onclick="tCheck('${code}','${k.id}')">${k.id}</button>
          <span class="lb">${esc(k.label)}</span>`;
        if(on){ const iid = `hits_${code}_${k.id}`;
          h += `hits <input type="number" id="${iid}" value="${on.hits}"> <span class="of">/ ${k.of}</span>`;
          bind(iid, ['cards',code,'checks',k.id,'hits']);
        }
        h += `</div>`;
      }
    }
    h += `<label class="f">Assist</label>${ASSISTS.map(a=>
      `<button class="chip ${cs.assist===a?'on':''}" style="${cs.assist===a?'background:var(--ink)':''}" onclick="setAssist('${code}','${a}')">${a}</button>`).join(' ')}
    <div class="why">Assisted reps are the training, not the test — anything but <b>none</b> is logged and does not count toward PASS.</div>`;
    const nid=`nc_${code}`, nyid=`ncw_${code}`, oid=`obs_${code}`;
    h += `<div class="row2"><div><label class="f">No-counts</label><input type="number" id="${nid}" value="${cs.no_count}"></div>
      <div><label class="f">Why</label><input type="text" id="${nyid}" value="${esc(cs.no_count_why)}"></div></div>`;
    bind(nid,['cards',code,'no_count']); bind(nyid,['cards',code,'no_count_why']);
    if(c.ifthen.length){
      h += `<label class="f">Failure modes seen <span class="hint">from this card's IF rows only</span></label><div class="chips">` +
        c.ifthen.map((r,i)=>`<button class="chip ${cs.modes.includes(i)?'on':''}" style="${cs.modes.includes(i)?'background:var(--alert)':''}" onclick="tMode('${code}',${i})">${esc(r[0].slice(0,42))}</button>`).join('') + `</div>`;
    }
    h += `<label class="f">OBSERVED — outside scored reps <span class="hint">what you noticed, not what you scored</span></label>
      <textarea id="${oid}">${esc(cs.observed)}</textarea></div>`;
    bind(oid,['cards',code,'observed']);
  }
  h += `</div>`;

  h += `<div class="fs"><h3>3 · AFTER — wrap</h3>`;
  if(wa){
    h += `<label class="f">Water temp °F <span class="req">* required on water outings</span></label>
      <div class="row2"><div><input type="number" id="f_wt" value="${S.water_temp_f}"></div>
      <div>${chipset(['reading','estimate'], S.water_temp_kind, 'setWTK')}</div></div>`;
  }
  h += `<label class="f">Session arc</label>${chipset(['built','flat','declined'], S.arc, 'setArc')}
    <label class="f">Ended on</label>${chipset(['fun rep','neutral','pressure rep'], S.ended_on, 'setEnd')}
    ${S.ended_on==='pressure rep'?'<div class="warn">Standing rule: never end a session on a pressure rep. Logged as it happened.</div>':''}
    <label class="f">Notes</label><textarea id="f_notes">${esc(S.notes)}</textarea></div>`;

  h += `<div id="exportBox"></div><button class="go" onclick="doExport()">VALIDATE &amp; EXPORT</button>
    <div class="subtle">Nothing is stored in this app. The export block pasted into SESSIONS.md is the record.</div>`;
  v.innerHTML = h;
  bind('f_notes',['notes']); bind('f_temp',['temp_f']); bind('f_len',['length_min']);
  bind('f_wt',['water_temp_f']); bind('f_loco',['locOther']); bind('f_date',['date']);
}

function doExport(){
  const miss = [];
  if(!S.handler_state) miss.push('handler state (asked before the session)');
  if(!S.location) miss.push('location');
  if(!S.tod) miss.push('AM or PM — SESSIONS.md headings are dated AND timed');
  if(!Object.keys(S.cards).length) miss.push('at least one card run');
  const wa = Object.keys(S.cards).some(c=>c.startsWith('WA-'));
  if(wa && !S.water_temp_f) miss.push('water temp — required on water outings');
  if(wa && S.water_temp_f && !S.water_temp_kind) miss.push('water temp: reading or estimate?');
  for(const [code,cs] of Object.entries(S.cards)){
    for(const [id,ck] of Object.entries(cs.checks))
      if(ck.hits==='') miss.push(`${code} ${id}: hits count — required, not skippable`);
  }
  const box = document.getElementById('exportBox');
  if(miss.length){
    box.innerHTML = `<div class="missing"><b>Cannot export — required fields missing:</b><br>· ${miss.map(esc).join('<br>· ')}</div>`;
    return;
  }
  let y = `# session ${S.date} — exported by reba app (deck ${DECK.build})\noutin`+`g:\n`;
  y += `  date: ${S.date}   # America/Chicago\n  tod: ${S.tod}\n  location: ${S.location==='Other'?(S.locOther||'other'):S.location}\n`;
  y += `  new_site: ${S.new_site}\n  new_ground: ${S.new_ground}\n`;
  if(S.temp_f) y += `  temp_f: ${S.temp_f}\n`;
  if(S.length_min) y += `  length_min: ${S.length_min}\n`;
  y += `  helper: ${S.helper}\n  birds: ${S.birds}\n  handler_state: ${S.handler_state}\n`;
  if(S.water_temp_f) y += `  water_temp_f: ${S.water_temp_f}   # ${S.water_temp_kind}\n`;
  y += `dog_sessions:\n  - dog: ${DECK.dog.toLowerCase()}\n    cards:\n`;
  for(const [code,cs] of Object.entries(S.cards)){
    const c = DECK.cards.find(x=>x.code===code);
    y += `      - card: ${code}\n        assist: ${cs.assist}\n`;
    const cks = Object.entries(cs.checks);
    if(cks.length){ y += `        checks:\n`;
      for(const [id,ck] of cks){
        const spec = c.checks.find(k=>k.id===id);
        y += `          - {id: ${id}, hits: ${ck.hits}, of: ${spec.of}, counts: ${cs.assist==='none'}}\n`;
      }}
    if(cs.no_count) y += `        no_count: {reps: ${cs.no_count}, why: "${cs.no_count_why}"}\n`;
    if(cs.modes.length) y += `        failure_modes:\n` + cs.modes.map(i=>`          - "${c.ifthen[i][0]}"\n`).join('');
    if(cs.observed) y += `        observed: "${cs.observed.replace(/"/g,"'")}"\n`;
  }
  if(S.arc) y += `    arc: ${S.arc}\n`;
  if(S.ended_on) y += `    ended_on: ${S.ended_on.replace(' ','_')}\n`;
  if(S.notes) y += `    notes: "${S.notes.replace(/"/g,"'")}"\n`;
  box.innerHTML = `<div class="export"><h3 style="margin:0 0 6px">EXPORT — paste into SESSIONS.md</h3><pre id="yml">${esc(y)}</pre>
    <button class="copy" onclick="navigator.clipboard.writeText(document.getElementById('yml').textContent).then(()=>this.textContent='COPIED')">COPY</button></div>`;
  box.scrollIntoView({behavior:'smooth'});
}

function render(){ renderCards(); renderLog(); }
render();

/* ---------- pull to refresh — CARDS TAB ONLY ----------
   iOS removes the browser's own pull-to-refresh once a PWA runs from the home
   screen, which is why picking up a new build meant force-quitting. Armed on the
   CARDS tab and nowhere else: this app stores nothing, so a reload part-way
   through a LOG entry would throw the session away. The service worker is
   network-first, so the reload fetches whatever build is published. */
(function(){
  const bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;top:0;left:0;right:0;height:0;overflow:hidden;'
    + 'display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;'
    + 'background:var(--gray);color:var(--muted);font-size:12px;letter-spacing:.08em;'
    + 'z-index:99;transition:height .12s ease-out;';
  document.body.appendChild(bar);
  const MAX = 80, TRIP = 56;
  let y0 = null, armed = false;
  const atTop = () => (window.scrollY || document.documentElement.scrollTop || 0) <= 0;
  const reset = () => { bar.style.height = '0px'; y0 = null; armed = false; };
  addEventListener('touchstart', e => {
    if(state.tab !== 'cards' || state.openCard || !atTop() || e.touches.length !== 1){ y0 = null; return; }
    y0 = e.touches[0].clientY; armed = false;
  }, {passive:true});
  addEventListener('touchmove', e => {
    if(y0 === null) return;
    const dy = e.touches[0].clientY - y0;
    if(dy <= 0){ bar.style.height = '0px'; armed = false; return; }
    const h = Math.min(MAX, dy * 0.55);
    bar.style.height = h + 'px';
    armed = h >= TRIP;
    bar.textContent = armed ? 'RELEASE TO REFRESH' : 'PULL TO REFRESH';
  }, {passive:true});
  addEventListener('touchend', () => {
    if(y0 === null) return;
    if(armed){ bar.textContent = 'REFRESHING'; location.reload(); }
    else reset();
  }, {passive:true});
  addEventListener('touchcancel', reset, {passive:true});
})();
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
