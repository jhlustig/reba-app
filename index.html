"blocked_note": null, "diagram": null}, {"code": "WA-5", "id": "water.s5", "track": "WA", "trackName": "Water", "color": "#3F5A6B", "type": "stage", "n": 5, "title": "Swim-By", "drill": "Casting transfers from land to water. The setup needs a piece of land that\nsticks out into the water — a point, a peninsula, or a narrow strip of bank.\nThe dog starts on one side and the pile is on the other side. The straight line\nto the pile goes through open water, swimming past the tip of the land. The\ncheating route is to climb out onto the land, run across it on dry ground, and\nre-enter the water on the other side. Dogs naturally take the dry route because\nswimming is harder than running — this drill teaches the dog to hold a water\nline even when land is available.\n\nNote: the whistle sit in open water means the dog stops forward progress\nand treads in place, facing you. The dog cannot literally sit in deep water —\ntreading while stationary is the water version of the sit.\n\nWhistle sit in open water first — confirm the dog will stop and tread while\nswimming. Then back, then overs one side at a time. The cast must be taken in\nthe water — the moment the dog touches land the rep is over and does not count.\nTeach back first, same as on land.\n\nCap swim-by sessions at 8-10 reps. Swimming is physically expensive, and\na tired dog cheats to land because it is exhausted, not because it is\ndisobedient. See {ref:water.ref_safety} for water intoxication signs.\n", "pass": "9/10 whistle sit held in open water. 8/10 each on back, left over, and right\nover, taken without touching land. Two sessions.\n", "body": "", "ifthen": [["Cheats to land on the cast", "Move the setup so land is not a shortcut. Shorten until the dog wins. See {ref:water.ref_bank}."], ["Will not sit in water", "Back to {ref:whistle.s4} on land. Open water is not where you teach a sit."], ["Pops mid-swim", "Over-handled. Run several water lines with no whistle at all before returning."]], "checks": [{"id": "c1", "label": "Whistle sit held in open water", "hits": 9, "of": 10}, {"id": "c2", "label": "Back, taken in water", "hits": 8, "of": 10, "sessions": 2}, {"id": "c3", "label": "Left over, taken in water", "hits": 8, "of": 10, "sessions": 2}, {"id": "c4", "label": "Right over, taken in water", "hits": 8, "of": 10, "sessions": 2}], "session_cap": null, "equipment": [], "requires": ["WA-4", "WH-6"], "trigger": null, "blocked_note": null, "diagram": "wa-5"}, {"code": "WA-6", "id": "water.s6", "track": "WA", "trackName": "Water", "color": "#3F5A6B", "type": "stage", "n": 6, "title": "Water T", "drill": "The Single T pattern from {ref:whistle.s8} moved onto water. Back pile across the\npond, two side piles in the shallows or on the far bank. Whistle-sit the dog\nmid-swim and cast. Everything the dog learned on land now happens in water, a\nmedium that requires real physical effort — the dog must stop swimming, tread\nwater on the sit, and then drive in a new direction on the cast. Cut the rep\ncount compared to land — water T is physically expensive. Cap at 6\nreps per session. See {ref:water.ref_safety} for water intoxication signs.\n", "pass": "8/10 pattern runs with a clean mid-swim stop and any of three casts taken, across\ntwo sessions.\n", "body": "", "ifthen": [["Slows mid-swim anticipating the stop", "Run several reps with no whistle at all until the swim is honest again."], ["Veers toward the near bank", "Suction. Re-run the straight back line alone until it is a highway."], ["Tires fast", "Water T is physically expensive. Cut the rep count, never the standard. See {ref:water.ref_safety}."]], "checks": [{"id": "c1", "label": "Mid-swim stop plus three casts clean", "hits": 8, "of": 10, "sessions": 2}], "session_cap": null, "equipment": [], "requires": ["WA-5", "WH-8"], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "WA-7", "id": "water.s7", "track": "WA", "trackName": "Water", "color": "#3F5A6B", "type": "stage", "n": 7, "title": "Water Blinds & Cheating Singles", "drill": "The hunt-day picture. A blind across water the dog has not seen planted, and\ncheating singles — marks deliberately set so the bank route looks shorter or\neasier than swimming the straight line. The dog must take the water line on the\nhandler's send even when dry ground is the obvious shortcut.\n\nThis is where every water skill converges: entry, steadiness, casting, and the\ntrust built in force to water. You pick up the diversion yourself — the dog\nis never rewarded for the cheat.\n", "pass": "3/4 water blinds at 50–70 yds with one handle or fewer, and 4/5 cheating singles\ntaken straight through the water.\n", "body": "", "ifthen": [["Takes the bank route", "Shorten the blind, increase the angle so the bank costs more than it saves. See {ref:water.ref_bank}."], ["Handles well but slows down", "Reduce reps. Water blinds are expensive. End early and end on a win."], ["No-go on the send", "The dog does not believe anything is out there. Show the plant for a few reps to rebuild confidence, then go back to planting out of sight."]], "checks": [{"id": "c1", "label": "Water blind 50-70 yds, one handle or fewer", "hits": 3, "of": 4}, {"id": "c2", "label": "Cheating single taken through the water", "hits": 4, "of": 5}], "session_cap": null, "equipment": [], "requires": ["WA-6", "LN-6", "WH-7"], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "WA-R1", "id": "water.ref_bank", "track": "WA", "trackName": "Water", "color": "#3F5A6B", "type": "reference", "n": null, "title": "Bank Running — Kill It Early", "drill": "", "pass": "", "body": "Bank running is the dog choosing the dry route. Every time it works it is\nreinforced by success — the dog still got the bumper.\n\nIt is not disobedience. It is efficiency, and the dog is right. Your job is to\nmake the straight line the easier one, not to punish the dog for taking the\neasier path.\n\nFixes: angle the setup so the bank offers no shortcut · shorten until the dog\ntakes water straight · use a channel or cove where dry land is not adjacent to\nthe line · stop the rep the moment the dog climbs out, so a cheat never finishes.\n\nCatch it in {ref:water.s1}. A bank runner that has been doing it for years is a\nrebuild, not a fix.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": "failure", "blocked_note": null, "diagram": null}, {"code": "WA-R2", "id": "water.ref_safety", "track": "WA", "trackName": "Water", "color": "#3F5A6B", "type": "reference", "n": null, "title": "Water Safety — Entry, Heat, Gulping", "drill": "", "pass": "", "body": "Submerged obstructions. Wade every entry before the dog's first send off it, and\nagain after high water. A limb a swimming dog never touches sits at chest height\nfor a dog launching off a bank at speed. Entries move with water level — pin\neach to a fixed object on the bank, not to the waterline.\n\nWater intoxication. Gulping while retrieving can dilute blood sodium enough to\nswell brain cells. Onset is fast — hours. Signs: vomiting, staggering, lethargy,\nglazed eyes, dilated pupils, drooling, bloating; seizures or collapse when\nsevere. This is a veterinary emergency. Smaller dogs are at higher risk.\n\nPrevention: frequent breaks, a hard cap on continuous reps, and stop the session\nif the dog gulps on the swim.\n\nHeat: warm water will not cool a working dog. Watch for overheating in the water,\nnot just on the bank. Ears: dry them after every session.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": "prerequisite", "blocked_note": null, "diagram": null}, {"code": "HU-T", "id": "hunt.title", "track": "HU", "trackName": "Blind & Hunt Day", "color": "#7A5240", "type": "title", "n": null, "title": "Blind & Hunt Day", "drill": "", "pass": "", "body": "This track teaches the dog to generalize skills learned on the other tracks to\nreal hunting environments — blinds, decoy spreads, boats, low light, and cold\nweather. Most of it is environmental conditioning, not new skill, so it runs\nalongside anything in the program.\n\nTwo things here are not conditioning and will hurt the dog if run early: a gun\nfired inside a box the dog cannot leave, and a send made while a gun is still\nup. Both have their own cards. Read them first.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "HU-1", "id": "hunt.s1", "track": "HU", "trackName": "Blind & Hunt Day", "color": "#7A5240", "type": "stage", "n": 1, "title": "Blind and Layout Manners", "drill": "A blind (or pit, or layout) is the structure you hunt from — a box the dog sits\nin beside you, sometimes for hours, while you call, watch, and shoot. This stage\nconditions the dog to settle in that environment without the excitement of birds.\n\nStart with an elevated platform or dog stand. Load the dog on command, then be a\nhunter around it: sit, stand, shoulder an unloaded gun, move the blind bag, work\nthe call. The dog does not move. NEVER run a correction on the stand — the dog\nshould load voluntarily because the stand is a positive place, and that\nassociation is bought once and lost once.\n", "pass": "Settles inside 30 sec and holds 10 min — no whine, no exit, no second\ncommand — 3 sessions. Then 5/5 holds through you standing and shouldering\nan unloaded gun.\n", "body": "", "ifthen": [["Breaks the stand to follow you", "Shorten to 2 min and rebuild. Walk back and re-place the dog — never call it off and never correct on it."], ["Whines but stays", "Duration ran ahead. Halve it, pay the quiet, build again. A whining dog in a blind is a dog nobody invites twice."], ["Winds up when you work the call", "The call has become a bird cue. See {ref:hunt.ref_call} before another rep."]], "checks": [{"id": "c1", "label": "Settles inside 30 sec, holds 10 min, one command", "hits": 1, "of": 1, "sessions": 3}, {"id": "c2", "label": "Holds through the handler standing and shouldering an unloaded gun", "hits": 5, "of": 5}], "session_cap": null, "equipment": ["invisilab", "unloaded_gun", "blind_bag", "duck_call"], "requires": [], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "HU-2", "id": "hunt.s2", "track": "HU", "trackName": "Blind & Hunt Day", "color": "#7A5240", "type": "stage", "n": 2, "title": "Decoys — Through and Around", "drill": "On land, most dogs learn to ignore decoys quickly — they look interesting but\ndo nothing, and the bumper is the obvious reward. Throw a bumper past a 6-decoy\nspread at 20 yds; the dog goes THROUGH, out and back, not around. If the dog\nalready ignores decoys on land, this is a confirmation, not a teaching step.\n\nWater is the real challenge and is gated behind {ref:water.s1} and {ref:water.s2}:\na floating decoy sits at the dog's eye level, rides the chop, and sits on a line\nthe dog can tangle in. The dog cannot step around it the way it can on land — it must\nswim through the spread without mouthing, investigating, or diverting from the\nline.\n", "pass": "Land 5/5 through a 6-decoy spread at 20 yds, no mouthing, no investigating,\n1 session. Water 5/5 through a 12-decoy spread, no mouthing, no diverting,\nno fouled line, 2 sessions. A head turn is a pass; a changed line is not.\n", "body": "", "ifthen": [["Picks a decoy up", "Stop the rep, take it, no correction. Shorten so the bumper is the obvious answer, then rebuild the spread."], ["Swims around the spread, not through", "That is bank running in a different coat. See {ref:water.ref_bank}."], ["Refuses to enter through decoys", "Open a lane, send through it, close the lane over sessions. Never push the dog into a spread."]], "checks": [{"id": "c1", "label": "LAND — 5/5 through a 6-decoy spread at 20 yds", "hits": 5, "of": 5}, {"id": "c2", "label": "WATER — 5/5 through a 12-decoy spread, nothing fouled", "hits": 5, "of": 5, "sessions": 2, "requires": ["WA-1", "WA-2"]}], "session_cap": null, "equipment": ["decoys", "bumpers"], "requires": [], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "HU-3", "id": "hunt.s3", "track": "HU", "trackName": "Blind & Hunt Day", "color": "#7A5240", "type": "stage", "n": 3, "title": "Gunfire from the Blind", "drill": "Read {ref:hunt.gate} first. Gunfire inside a blind is a different event from\ngunfire on open ground — the enclosed space amplifies the sound, reflects it\nback at the dog, and the dog has no room to move away from it. This is why\n{ref:steadiness.s4} (steady through the gun on open ground) is the gate, not a\nsuggestion.\n\nGunfire starts OUTSIDE the blind at distance and moves closer over sessions —\nnever fire the first shot of a day from inside. Shot, then a mark. Six shots\nfrom inside the blind per session, maximum.\n", "pass": "8/10 steady in the stand through a shot fired from inside, followed by a\nmark, 2 sessions.\n", "body": "", "ifthen": [["Flinches or checks out at the report", "STOP. Gun back outside and out to distance, happy retrieves only, rebuild over weeks. Do not push through."], ["Breaks off the stand on the shot", "Steadiness, not noise. Back to {ref:steadiness.s4} on open ground; the box makes a break worse, not better."], ["Fine outside, tense inside", "The box is the variable. Same shot, stand door open, then closed. One axis."]], "checks": [{"id": "c1", "label": "Steady in the stand, shot from inside, then a mark", "hits": 8, "of": 10, "sessions": 2}], "session_cap": {"reps": 6, "applies_to": "shots fired from inside", "note": "Six shots from inside the stand a session, maximum."}, "equipment": ["invisilab", "poppers_12ga", "bumpers"], "requires": ["MK-4", "HU-1"], "trigger": null, "blocked_note": "Needs MK-4. Read the Gate card before the first rep.", "diagram": null}, {"code": "HU-4", "id": "hunt.s4", "track": "HU", "trackName": "Blind & Hunt Day", "color": "#7A5240", "type": "stage", "n": 4, "title": "Boat and Stand Work", "drill": "Many hunts happen from a boat — the dog must load, hold position, and unload on\ncommand in an unstable environment. Start tied off at the bank, engine off,\nbefore anything moves. Load on command, sit, unload on command — the gunwale (the top edge of the boat's side) is\na height problem, the same as an elevated entry in {ref:water.s2}. Then hold\nposition while YOU rock the boat from inside. Never lift the dog in and never\npush it out.\n", "pass": "5/5 load and unload on command from a stationary boat. Holds position 10 min\nwith the boat rocking, 2 sessions.\n", "body": "", "ifthen": [["Will not load", "Height, not water. Lower the step: bank first, then a stable boat edge. Let the dog choose to go."], ["Scrambles when it rocks", "Footing. Mat the deck and rock it less. Rebuild the amplitude, not the dog's tolerance for slipping."], ["Jumps out on the mark", "Steadiness in a new picture. Lead on, back to a 1-sec delay, rebuild in the boat."]], "checks": [{"id": "c1", "label": "Loads and unloads on command, boat stationary", "hits": 5, "of": 5}, {"id": "c2", "label": "Holds position 10 min with the boat rocking", "hits": 1, "of": 1, "sessions": 2}], "session_cap": null, "equipment": ["boat", "invisilab", "lead"], "requires": ["HU-1"], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "HU-5", "id": "hunt.s5", "track": "HU", "trackName": "Blind & Hunt Day", "color": "#7A5240", "type": "stage", "n": 5, "title": "Honoring and Multiple Dogs", "drill": "Honoring means the dog holds steady while another dog works — one of the\nhardest steadiness tests because the dog is watching everything it wants to do\nbeing done by someone else.\n\nAnother dog is sent; your dog holds. On lead for the first sessions — the lead\nis the drill, not a crutch, and it is what makes the break impossible while the\nrule is being learned. Your dog's turn comes second at first, so holding pays.\n", "pass": "Honors another dog's retrieve 5/5 — no break, no whining, no creeping off\nthe stand — 2 sessions.\n", "body": "", "ifthen": [["Breaks when the other dog is sent", "Lead under your foot and shorten the other dog's retrieve. Prevent it; do not correct it."], ["Whines while honoring", "The dog is held past what it can hold. Send your dog first for a few reps, then alternate."], ["Fine on lead, breaks off it", "The dog was holding the lead. Same wean as {ref:steadiness.s4} — tab on, stay close."]], "checks": [{"id": "c1", "label": "Honors another dog's retrieve, no break, no whining", "hits": 5, "of": 5, "sessions": 2}], "session_cap": null, "equipment": ["lead", "invisilab"], "requires": ["MK-7"], "trigger": null, "blocked_note": "This stage needs a SECOND DOG and a helper. There is no solo version.", "diagram": null}, {"code": "HU-6", "id": "hunt.s6", "track": "HU", "trackName": "Blind & Hunt Day", "color": "#7A5240", "type": "stage", "n": 6, "title": "Low Light, Real Cover, Cold", "drill": "Not a new skill — a re-validation, which is exactly why it gets skipped. Take\nnumbers the dog has already passed and re-meet them in the conditions a hunt\nactually happens in: legal shooting light, 30 minutes before sunrise, and\nstanding cover. A dog that is solid at noon on a mowed field has not proven it\ncan do the same thing in the dark in heavy cover.\n\nThe full blind structure goes up here — {ref:hunt.s1} used a bare platform and\nthe blind is the new variable, added alone.\n\nNo gunfire on this card. Gunfire in the blind is {ref:hunt.s3}'s job. This\ncard tests the environment — low light, cover, cold — not the gun.\n\nCold weather safety: a dog working in cold water before sunrise is at real\nrisk. Watch for shivering that does not stop within 2 minutes of exiting\nthe water, lethargy, stumbling, or a tucked posture. If water temperature\nis below 45°F, limit water retrieves to 3-4 per session and dry the dog\nbetween retrieves. Wind chill amplifies the risk — a wet dog in wind loses\nheat fast. A neoprene vest helps but does not eliminate the risk.\n", "pass": "Re-meet {ref:hunt.s1}'s 10 min hold and {ref:hunt.s2}'s land 5/5, at shooting\nlight and in standing cover, 2 sessions each.\n", "body": "", "ifthen": [["Numbers drop in the dark", "Expected, and it is the point. Drop the distance, not the standard, and rebuild in the low light."], ["Settles on the bare stand, not in the blind", "The blind is the variable. Sides down one at a time, roof last."], ["Hunts short in standing cover", "Cover eats a mark. Shorten until the dog wins, then stretch — this is {ref:steadiness.s5}'s rule, borrowed."]], "checks": [{"id": "c1", "label": "HU-1's 10 min hold re-met at shooting light, in the blind", "hits": 1, "of": 1, "sessions": 2}, {"id": "c2", "label": "HU-2's land 5/5 re-met in standing cover, low light", "hits": 5, "of": 5, "sessions": 2}], "session_cap": null, "equipment": ["invisilab", "mock_blind", "decoys", "bumpers"], "requires": ["HU-1", "HU-2"], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "HU-7", "id": "hunt.s7", "track": "HU", "trackName": "Blind & Hunt Day", "color": "#7A5240", "type": "stage", "n": 7, "title": "Simulated Hunts — The Whole Picture", "drill": "Everything at once, and nothing new. Blind, spread, calls, a shot, land and\nwater falls, retrieve order, guns down before any send. Run it like a hunt,\nnot like a training session: no coaching, no re-cast, no second try.\n\nThe purpose is diagnostic, not teaching. What breaks here tells you which card\nto go back to — it is not a thing you fix on the day.\n", "pass": "2 consecutive simulated hunts with zero breaks, zero unplanned handles on\nmarks (handles on blinds are expected and do not count against the pass),\nand correct retrieve order throughout.\n", "body": "", "ifthen": [["One thing breaks every time", "Good — that is the card. Go back to it and stop running simulations until it holds."], ["Everything is loose at once", "Too much at once too soon. Drop back to HU-6 and add one element per session."], ["Handles well but has stopped enjoying it", "See {ref:steadiness.ref_suppression}. A finished dog that does not want to go is not finished."]], "checks": [{"id": "c1", "label": "Simulated hunt — no break, no unplanned handle on marks, correct order", "hits": 2, "of": 2}], "session_cap": null, "equipment": [], "requires": ["HU-1", "HU-2", "HU-3", "HU-4", "HU-5", "HU-6", "MK-4", "WA-3"], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "HU-G", "id": "hunt.gate", "track": "HU", "trackName": "Blind & Hunt Day", "color": "#7A5240", "type": "gate", "n": null, "title": "GATE — Gunfire from the Blind", "drill": "", "pass": "", "body": "Do not run {ref:hunt.s3} until {ref:steadiness.s4} has banked: off lead,\nsteady through fall, delay and gun, on open ground.\n\nOn open ground the dog can move away from the report. In a blind it cannot —\nit is close range, over the dog's head, in a box that reflects the sound back.\nThat is a different event, and the dog meets it with no exit.\n\n{ref:steadiness.s3}'s own IF row reads \"Stop. Do not push through. Rebuild over\nweeks.\" A flinch at the report costs weeks and it is the one fault on this track\nthat gets harder to fix the longer it runs.\n\nNever fire the first shot of a training day from inside the blind.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "HU-R1", "id": "hunt.ref_call", "track": "HU", "trackName": "Blind & Hunt Day", "color": "#7A5240", "type": "reference", "n": null, "title": "The Duck Call Is a Stillness Cue", "drill": "", "pass": "", "body": "Read before {ref:hunt.s1}. The duck call is RESERVED for this track. Do not use\nit during marking or steadiness work — the call must never predict a bird.\n\nProtect it. On hunt day you blow a call with the dog beside you, repeatedly, and\nmost of those calls end in nothing at all. If a call predicts a bird you have\nbuilt a dog that winds up every time you work a flock, which is every few\nminutes, for four hours.\n\nSo condition the opposite, from the first session. Call while the dog is settled\non the stand and NOTHING happens. Pay the stillness, not the sound. Work the\ncall through the dead time between reps, never in the second before a throw.\n\nThe test is simple and it is easy to fail without noticing: if the dog's head\ncomes up on the call, the call has become a cue. Stop throwing anywhere near it\nfor a week and re-pay the stillness.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": "prerequisite", "blocked_note": null, "diagram": null}, {"code": "HU-R2", "id": "hunt.ref_order", "track": "HU", "trackName": "Blind & Hunt Day", "color": "#7A5240", "type": "reference", "n": null, "title": "Retrieve Order and Safety", "drill": "", "pass": "", "body": "Read before {ref:hunt.s5} and {ref:hunt.s7}, and before any hunt with other\nguns. The strongest language in the deck, and it is about the people.\n\nNOBODY SENDS UNTIL EVERY GUN IS DOWN AND THE SHOOTING IS OVER. In a party\nof four the send is a social act, not a handler's decision. You send\nbecause the shooting stopped and you said so out loud — not because you\nsaw a bird fall.\n\nTHE DOG WORKS IN FRONT OF A LINE OF GUNS. Its outbound path crosses lanes\nbelonging to people who are not watching it. Know where the line runs before\nthe dog is on it.\n\nOrder: cripples (wounded birds still moving) first, farthest cripple before the nearest, dead birds\nlast. A bird still swimming is the only reason to break the order, and it\nis decided before the send.\n\nSay the plan out loud before the first flight. A blind is loud and your\nfriends are not reading your mind.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": "prerequisite", "blocked_note": null, "diagram": null}, {"code": "HU-R3", "id": "hunt.ref_test", "track": "HU", "trackName": "Blind & Hunt Day", "color": "#7A5240", "type": "reference", "n": null, "title": "Hunt Test vs. Hunting", "drill": "", "pass": "", "body": "This deck serves both hunters and handlers training for hunt tests. Where the\ntwo diverge, the handler decides which wins — the app's AI personalization will\nset this preference at intake.\n\nWhere they do NOT diverge, and it is most of the way: steadiness, marking,\nhonoring, a clean delivery to hand, a stop at distance. HRC (Hunting Retriever Club) runs tests that mirror the hunting picture — a\nhunting picture, which is why club days are worth going to.\n\nWhat a test buys you that a hunt does not: a scored, dated, third-party read\non a dog you see every day. What it costs: reps spent on polish that a duck\ndoes not check. Spend them knowingly.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": "browse", "blocked_note": null, "diagram": null}], "glossary": {"angle_back": {"term": "angle back", "short": "A cast sending the dog to a pile at 45 degrees between straight back and over.", "full": "The arm signal is between vertical (back) and flat (over) — arm raised at\nroughly 45 degrees. Right arm at 45 degrees sends the dog to the right\nangle-back pile; left arm at 45 degrees to the left. Different from a\nright or left hand back, which sends the dog to the straight-back pile\nwith a controlled spin direction.\n", "see_also": ["back", "right_hand_back", "left_hand_back", "over", "casting", "wagon_wheel"], "tracks": ["WH"]}, "back": {"term": "back", "short": "A cast sending the dog straight away from the handler.", "full": "The handler raises one hand straight overhead. The dog turns and drives\ndirectly away. In baseball, back sends the dog to second base. The hand\nused (right or left) determines spin direction — see right hand back and\nleft hand back.\n", "see_also": ["right_hand_back", "left_hand_back", "angle_back", "casting"], "tracks": ["WH", "LN"]}, "backing": {"term": "backing", "short": "One dog freezing in a point posture when it sees another dog on point.", "full": "Also called honoring. The backing dog has not smelled the bird — it is\nresponding to the visual cue of seeing another dog locked up on point.\nBacking is partially instinctive in well-bred pointing breeds but must be\nproofed under excitement. Not the same as honoring in a duck blind, where\na retriever holds steady while another dog retrieves.\n", "see_also": ["honoring"], "tracks": ["BK", "PT"]}, "bank_running": {"term": "bank running", "short": "The dog choosing the dry land route instead of swimming the straight line.", "full": "Not disobedience — it is efficiency. Swimming is harder than running, and\nthe dog is right that the bank is easier. The handler's job is to make\nthe water line the easier path, not to punish the dog for taking the\nshorter route. Catch it early — a dog that has been bank running for\nyears is a rebuild, not a fix.\n", "see_also": ["cheating_single", "swim_by"], "tracks": ["WA"]}, "baseball": {"term": "baseball", "short": "A casting drill with the dog on the pitcher's mound and piles at first, second, and third base.", "full": "First base is the right over pile, second base is straight back, third\nbase is left over. Teaches the dog to take direction on the handler's\nhand signal. Back is taught first, then overs one side at a time, then\nmixed. Right and left hand backs and angle backs are added in later stages.\n", "see_also": ["casting", "back", "over", "wagon_wheel"], "tracks": ["WH"]}, "blind": {"term": "blind", "short": "A retrieve the dog did not see planted — or the structure a hunter sits in.", "full": "Two meanings depending on context. (1) A blind retrieve: the dog is sent\nto pick up a bumper or bird it did not watch fall. The dog must trust the\nhandler's line and drive to a destination on faith. (2) A duck blind: the\nphysical structure (box, pit, layout) the handler hunts from. Context\nmakes the meaning clear — \"run a blind\" vs. \"sit in the blind.\"\n", "see_also": ["pattern_blind", "cold_blind", "memory_retrieve"], "tracks": ["LN", "HU"]}, "bumper": {"term": "bumper", "short": "A plastic or canvas training dummy used in place of a bird.", "full": "Also called a dummy. Comes in puppy size (smaller, softer) and standard\n(2-inch or 3-inch diameter). Used for all retrieve training before birds\nare introduced, and for most drill work throughout the program. The bumper\nlives in a drawer and appears only for sessions — a retrieve that is\nalways available stops being worth anything.\n", "see_also": [], "tracks": ["PP", "MK", "LN", "WA"]}, "capture": {"term": "capture", "short": "Marking and rewarding a behavior the dog offers naturally, without luring or shaping it.", "full": "You cannot lure a dog into yawning, or into the spontaneous relaxation of\na settle. You can only notice it happening and mark it in the moment.\nCapturing works well for behaviors that already occur naturally. In this\nprogram, settle is taught by capturing — when the dog visibly relaxes\n(hips roll, eyes soften), mark gently and reward.\n", "see_also": ["lure", "shaping", "mark", "settle"], "tracks": ["OB"]}, "casting": {"term": "casting", "short": "Directing the dog left, right, or back using hand signals.", "full": "The handler uses arm position to tell the dog which direction to go. Arm\nflat to the side = over (go that direction). Arm straight overhead = back\n(go directly away). Arm at 45 degrees = angle back. Casts are always\nnamed from the handler's perspective, never the dog's.\n", "see_also": ["back", "over", "angle_back", "right_hand_back", "baseball"], "tracks": ["WH", "LN", "WA"]}, "check_cord": {"term": "check cord", "short": "A long lightweight line (20-50 ft) attached to the dog's collar for training at distance.", "full": "Gives the handler the ability to enforce commands at distance without an\ne-collar. The dog experiences freedom but the handler can step on the line\nor pick it up if needed. Used for recall training, early steadiness, and\nright/left hand back work. Not a retractable leash — a simple rope or\nlightweight line.\n", "see_also": ["tab", "dragging_line"], "tracks": ["OB", "WH", "PP"]}, "cheating_single": {"term": "cheating single", "short": "A mark deliberately set so the bank route looks easier than swimming the straight line.", "full": "Used to test and train the dog's commitment to taking a water line. The\nthrown bumper lands across water, but a strip of bank offers a shortcut.\nThe dog must take the water line on the handler's send even when dry\nground is the obvious shortcut.\n", "see_also": ["bank_running", "swim_by"], "tracks": ["WA"]}, "classical_conditioning": {"term": "classical conditioning", "short": "Learning by association — a neutral stimulus becomes meaningful by being paired with something the dog already responds to.", "full": "Pavlov's dogs salivated at a bell because the bell had been paired with\nfood. The same mechanism drives noise conditioning: pair a sound with food\nrepeatedly, and the sound itself becomes a positive signal. Also how the\nduck call becomes a stillness cue — pair the call with calm waiting, and\nthe call triggers calm. The dog does not choose this response; its nervous\nsystem learns the association automatically.\n", "see_also": ["flooding", "systematic_desensitization", "operant_conditioning"], "tracks": ["PP", "HU"]}, "cold_blind": {"term": "cold blind", "short": "A blind retrieve on ground the dog has never trained on, with no prior knowledge of where the bumper is.", "full": "The final skill in the lining progression. Everything before it — backstop\nlines, memory retrieves, pattern blinds — builds the dog's confidence and\ntrust that the handler is sending it somewhere real. A cold blind is the\ntest of whether that trust holds on unfamiliar ground.\n", "see_also": ["blind", "pattern_blind", "memory_retrieve"], "tracks": ["LN"]}, "diversion": {"term": "diversion", "short": "A thrown bumper or bird meant to tempt the dog off its sent line.", "full": "The handler throws or plants a visible temptation to one side, then sends\nthe dog on a different line. The dog must ignore the diversion and take\nthe handler's line. On a hunt day, a bird falls and the dog must ignore\nit to run a blind to a different bird — that is the real-world picture\nthis drill prepares for.\n", "see_also": ["blind", "cheating_single"], "tracks": ["LN", "WA"]}, "double": {"term": "double", "short": "Two marks thrown in sequence — the dog retrieves the second throw first, then the first.", "full": "The first throw is the memory bird (the one the dog must remember). The\nsecond throw is the go-bird (retrieved first because it is freshest in\nmemory). Retrieve order is always last-down first. The second throw is\nthe biggest break trigger in steadiness training because the dog is\nalready excited from the first fall.\n", "see_also": ["memory_bird", "go_bird", "single"], "tracks": ["MK"]}, "dragging_line": {"term": "dragging line", "short": "A check cord attached to the collar but trailing on the ground, not held by the handler.", "full": "The step between a managed check cord and a tab. The dog feels free but\nthe handler can step on the line if needed. Used during the transition to\noff-lead work — the dog experiences freedom while the handler retains a\nbackup. Spend weeks in this phase, not days.\n", "see_also": ["check_cord", "tab"], "tracks": ["OB"]}, "engineer_the_win": {"term": "engineer the win", "short": "Set the dog up to succeed. If the dog cannot win at the current difficulty, simplify until it can.", "full": "The overarching training principle. Every drill should be designed so the\ndog is likely to succeed. If it fails, the difficulty was too high — drop\nback to a level the dog can win at and build from there. A dog that\npractices failing learns to fail. A dog that practices winning learns the\nbehavior you want.\n", "see_also": ["three_ds"], "tracks": []}, "extinction_burst": {"term": "extinction burst", "short": "A behavior getting dramatically worse before it goes away, when the reward for it is removed.", "full": "When a behavior that used to work stops working, the dog escalates — louder,\nharder, more persistent — before giving up. Like hitting a vending machine\nthat stopped dispensing. The burst is a sign the approach is working, not\nfailing. If you give in during the burst, you teach the dog that the\nescalated version is the one that works.\n", "see_also": [], "tracks": []}, "flooding": {"term": "flooding", "short": "Forcing exposure to a fear trigger at full intensity. Dangerous — can create permanent fear responses.", "full": "The opposite of systematic desensitization. Instead of gradual, positive\nexposure, the dog is exposed to the full stimulus with no escape. A gun\nfired over an unprepared dog's head is flooding. A puppy thrown into deep\nwater is flooding. The result is usually sensitization (fear gets worse),\nnot habituation. Gun-shyness is almost always the product of flooding.\n", "see_also": ["systematic_desensitization", "classical_conditioning"], "tracks": ["PP"]}, "force_fetch": {"term": "force fetch", "short": "Trained retrieve using pressure to teach a reliable hold and delivery to hand.", "full": "Also called conditioned retrieve or trained retrieve. Uses ear pinch, toe\nhitch, or e-collar pressure to teach the dog to pick up, hold, and\ndeliver on command — not as a choice but as a trained response. Requires\nall 42 adult teeth and solid basic obedience. Never started during\nteething, never started before the dog understands the commands being\nasked. The e-collar reinforces a command already learned through force\nfetch — it does not replace the teaching.\n", "see_also": ["hold"], "tracks": ["FO"]}, "go_bird": {"term": "go-bird", "short": "The last mark thrown in a double or triple — retrieved first.", "full": "In a double, two bumpers are thrown. The go-bird is the second throw —\nthe one the dog retrieves first because it is freshest in memory. The\nfirst throw is the memory bird, retrieved second. Retrieve order is\nalways last-down first.\n", "see_also": ["memory_bird", "double"], "tracks": ["MK"]}, "hold": {"term": "hold", "short": "The dog keeping a bumper or bird in its mouth until the handler takes it.", "full": "Before force fetch, hold is built as a voluntary carrying culture — the\ndog is rewarded for having things in its mouth and never grabbed from.\nAfter force fetch, hold is a trained command. A reliable hold is what\nproduces a clean delivery to hand instead of a dropped bird at the\nhandler's feet.\n", "see_also": ["force_fetch"], "tracks": ["PP", "FO"]}, "honoring": {"term": "honoring", "short": "Holding steady while another dog works.", "full": "In waterfowl hunting, honoring means one dog sits quietly while another\ndog retrieves. In upland hunting with pointing breeds, honoring (also\ncalled backing) means freezing in a point posture when seeing another dog\non point. Both require the dog to watch everything it wants to do being\ndone by someone else — one of the hardest steadiness tests.\n", "see_also": ["backing", "steadiness"], "tracks": ["HU", "MK", "BK"]}, "left_hand_back": {"term": "left hand back", "short": "A back cast given with the left hand raised vertical — the dog spins over its right shoulder.", "full": "Same destination as a regular back (straight back pile / second base),\nbut the left hand raised cues the dog to spin to its right. Used for\ninfluence control — keeping the dog off hazards, banks, or other dogs'\nlines by controlling which direction it turns. Different from a left\nangle back, which sends the dog to a different destination at 45 degrees.\n", "see_also": ["right_hand_back", "back", "angle_back"], "tracks": ["WH"]}, "learned_helplessness": {"term": "learned helplessness", "short": "A state where the dog stops trying because it cannot predict, understand, or escape pressure.", "full": "When a dog receives pressure it cannot connect to any behavior — no\naction makes the pressure stop — it eventually gives up. The dog\nbecomes passive: not calm, not obedient, just shut down. It looks\ncompliant on the surface but has stopped learning entirely. Learned\nhelplessness is caused by unpredictable, uncontrollable aversive\nstimulation — most commonly an e-collar used before the dog\nunderstands the command being enforced. Recovery is possible but\nslow. Prevention is the reason this program teaches every command\nwith positive reinforcement before any collar pressure is applied.\n", "see_also": ["operant_conditioning", "classical_conditioning"], "tracks": ["WH"]}, "lure": {"term": "lure", "short": "Using food or a toy to physically guide the dog into a behavior.", "full": "The treat in front of the nose draws the sit. The treat on the floor\ndraws the down. Luring is fast and clear but must be faded quickly —\nwithin a few repetitions — by hiding the food in a closed fist, then\nan empty hand, then transitioning to a pure hand signal. A dog trained\nonly with visible food has learned to follow food, not to respond to a\ncommand.\n", "see_also": ["shaping", "capture", "mark"], "tracks": ["OB"]}, "mark": {"term": "mark", "short": "A precise signal ('yes' or a clicker) that tells the dog 'that exact thing you just did earned a reward.'", "full": "The marker bridges the gap between the behavior and the delivery of the\nreward. Without a marker, the dog must guess which part of everything it\ndid earned the treat. The instant the rump hits the ground, you say 'yes'\n— that sound marks the exact behavior. You then have 2-3 seconds to\ndeliver the reward without losing precision. Also called a bridge signal.\nA verbal 'yes' is preferred over a clicker for field work because your\nhands are often full of gun, leash, and bumper.\n", "see_also": ["lure", "shaping", "capture"], "tracks": ["OB", "PP"]}, "memory_bird": {"term": "memory bird", "short": "The first mark thrown in a double — retrieved second.", "full": "The dog must remember where this bumper landed while it retrieves the\ngo-bird first. Memory bird retrieves test the dog's ability to hold a\nmental picture of a fall location through the excitement of a second\nthrow and a retrieve. Doubles are the foundation of all advanced marking.\n", "see_also": ["go_bird", "double"], "tracks": ["MK"]}, "memory_retrieve": {"term": "memory retrieve", "short": "Walking the dog to a planted bumper, then walking back and sending — the dog saw the plant but must remember it.", "full": "The bridge between a seen retrieve and a blind. The dog watches you plant\nthe bumper, then must hold the memory while you walk back to the send\npoint. Builds trust that something is out there even when the send\nhappens from a distance. The about-turn direction matters — turn away\nfrom the plant, not across the dog's line to it.\n", "see_also": ["blind", "pattern_blind", "cold_blind"], "tracks": ["LN"]}, "no_bird": {"term": "no-bird", "short": "A throw where the dog does not get sent to retrieve.", "full": "The bumper is thrown, the dog holds, and the handler walks out and picks\nit up instead of sending the dog. Teaches the dog that a throw does not\nalways mean a retrieve — the dog releases to its name, not to the throw.\nUsed sparingly (one rep in eight at most) to prevent anticipation. Too\nmany no-birds sour the dog on the drill.\n", "see_also": ["steadiness"], "tracks": ["MK"]}, "operant_conditioning": {"term": "operant conditioning", "short": "Learning from consequences — the dog does something, something happens, and future behavior changes.", "full": "Four quadrants: positive reinforcement (add something good to increase\nbehavior), negative reinforcement (remove something unpleasant to increase\nbehavior), positive punishment (add something unpleasant to decrease\nbehavior), negative punishment (remove something good to decrease\nbehavior). Puppy training uses almost exclusively positive reinforcement\nand negative punishment. The e-collar (negative reinforcement and positive\npunishment) enters only after commands are fully learned.\n", "see_also": ["classical_conditioning", "premack_principle"], "tracks": []}, "over": {"term": "over", "short": "A cast sending the dog to the left or right — arm extended flat to the side.", "full": "The handler extends one arm straight out to the side — left arm for\nleft over, right arm for right over. The dog turns and runs in that\ndirection. One of the three basic casts (back, left over, right over).\n", "see_also": ["back", "angle_back"], "tracks": ["WH"]}, "pile": {"term": "pile", "short": "A stack of bumpers placed at a known spot — the dog retrieves from the pile repeatedly.", "full": "Casts are named from the handler's perspective. A right over means the\nhandler's right arm goes out and the dog moves in that direction. In\nbaseball, right over sends the dog to first base, left over to third\nbase. Never describe a cast from the dog's point of view.\n", "see_also": ["back", "angle_back", "casting"], "tracks": ["WH"]}, "parading": {"term": "parading", "short": "The dog running loops or victory laps with the bumper instead of returning straight to the handler.", "full": "A recall problem with a bumper in the mouth, not a hold problem. Every\nlap rewards the dog with possession plus movement. The fix is prevention\n(check cord, narrow corridor) not correction (chasing makes it worse).\nDiagnosed by consistency: always to the same side = handler habit, either\nside = attitude.\n", "see_also": ["hold"], "tracks": ["MK"]}, "pattern_blind": {"term": "pattern blind", "short": "A blind retrieve on familiar ground where the dog has run the same line before.", "full": "The dog's first true blind — a bumper planted out of sight on the same\nbackstop used since lining Stage 1. The familiar ground reduces variables\nso the dog can learn to trust the handler's line without the added\ndifficulty of unfamiliar terrain. Pattern blinds bridge the gap between\nmemory retrieves and cold blinds.\n", "see_also": ["blind", "cold_blind", "memory_retrieve"], "tracks": ["LN"]}, "place_board": {"term": "place board", "short": "A portable elevated platform (3-6 inches) that gives the dog a clear physical boundary.", "full": "Unlike sit on open ground, the board provides a tactile edge the dog can\nfeel. The dog knows exactly where the boundary is. Used to teach place\ncommand, build duration, and create a portable home base for any training\ncontext. Introduction uses shaping — reward the first paw, then two, then\nall four.\n", "see_also": ["shaping"], "tracks": ["OB", "WH"]}, "popping": {"term": "popping", "short": "The dog stopping mid-retrieve to look back at the handler for direction when none was asked for.", "full": "A sign of over-handling — the dog expects to be stopped on every send and\nis checking in rather than driving to the fall. Caused by too many whistle\nstops relative to free retrieves. The fix is fewer stops: let the dog run\nmore lines without handling before returning to whistle work. Expensive to\nfix once established — catch it early.\n", "see_also": ["over_suppression"], "tracks": ["WH", "LN", "WA"]}, "premack_principle": {"term": "Premack principle", "short": "Using what the dog wants most (the retrieve) as the reward for what you need it to do first (sit still).", "full": "The entire mechanical foundation of steadiness training. The dog watches\na bird fall and wants nothing more than to go get it. Sitting still is\nthe last thing it wants to do. The Premack principle turns the retrieve\ninto the reward for the sit: hold still first, then you get to go. Over\ntime, the sit itself takes on the excitement of what follows it — the dog\nsits with intensity rather than reluctance.\n", "see_also": ["steadiness", "variable_reinforcement"], "tracks": []}, "recall": {"term": "recall", "short": "Calling the dog to come to you — the most important safety command.", "full": "The recall is the command that brings the dog back to you. In this\nprogram, the verbal recall is \"here\" and the whistle recall is a\nseries of rapid blasts. The recall must be reliable in every\nsituation because it is a safety tool — a dog that will not come\nwhen called is a dog the handler cannot control in the field.\n", "see_also": ["release_word"], "tracks": ["OB", "WH"]}, "release_word": {"term": "release word", "short": "The word that ends a command — the dog does not move until it hears this word.", "full": "Chosen by the handler at intake. Common choices: okay, free, break. Sit\nmeans sit until the release word. Place means stay on the board until the\nrelease word. The crate door opening is not the release — the word is.\nEveryone who handles the dog must use the same release word. Pick\nsomething you do not say often in conversation.\n", "see_also": [], "tracks": ["OB", "MK"]}, "right_hand_back": {"term": "right hand back", "short": "A back cast given with the right hand raised vertical — the dog spins over its left shoulder.", "full": "Same destination as a regular back (straight back pile / second base),\nbut the right hand raised cues the dog to spin to its left (away from the\nraised hand). Used for influence control on blinds and in water — keeping\nthe dog off banks, spreads, or other dogs' lines. Different from a right\nangle back, which sends the dog to a different destination at 45 degrees.\n", "see_also": ["left_hand_back", "back", "angle_back"], "tracks": ["WH"]}, "settle": {"term": "settle", "short": "A mental state cue — lie down in a relaxed posture with hips rolled, head lowered, breathing slow.", "full": "Different from down, which is a positional command (lie down, can be\nalert). Settle means decompress and wait. This is the blind picture — a\ndog flat and loose at your side for hours. Taught by capturing: when the\ndog visibly relaxes, mark gently and reward. Over time, adding the cue\nword (chosen at intake) lets you ask for the relaxed state.\n", "see_also": ["capture"], "tracks": ["OB", "HU"]}, "shaping": {"term": "shaping", "short": "Rewarding small steps toward the final behavior rather than waiting for the whole thing at once.", "full": "If the goal is all four paws on the place board, shaping starts by\nrewarding the first paw that touches. Then two paws. Then three. Then all\nfour. The dog is an active problem-solver — it offers behaviors and learns\nfrom the consequences. Shaping builds confidence and a dog that tries new\nthings. Slower than luring but produces deeper understanding.\n", "see_also": ["lure", "capture"], "tracks": ["OB"]}, "single": {"term": "single", "short": "One mark thrown — the dog retrieves one bumper.", "full": "The simplest retrieve setup. Most early training is singles. In\nsteadiness work, singles are used to build the hold before adding the\ncomplexity of a second throw (doubles). A hallway single is the first\nretrieve a puppy ever does.\n", "see_also": ["double", "memory_bird", "go_bird"], "tracks": ["MK", "PP"]}, "steadiness": {"term": "steadiness", "short": "The dog holding position through excitement — a throw, a shot, another dog working — until released.", "full": "The core discipline of a finished gun dog. A steady dog does not break\nwhen a bird falls, does not chase when a gun fires, does not move when\nanother dog is sent. Steadiness is built by preventing the break (lead,\ntab, mechanical management), never by punishing it. Marking desire is\nprotected throughout — a slow, reluctant dog is a far more expensive\nproblem than a dog that breaks.\n", "see_also": ["premack_principle", "over_suppression"], "tracks": ["MK", "WA", "HU"]}, "swim_by": {"term": "swim-by", "short": "A water casting drill where the dog must swim past a point of land instead of running across it.", "full": "The setup needs land that sticks out into the water — a point, peninsula,\nor narrow strip of bank. The dog starts on one side and the pile is on\nthe other. The straight line goes through open water, swimming past the\ntip. The cheating route is to climb out, run across on dry ground, and\nre-enter. Dogs naturally take the dry route because swimming is harder —\nthis drill teaches the dog to hold a water line even when land is\navailable.\n", "see_also": ["bank_running", "cheating_single"], "tracks": ["WA"]}, "systematic_desensitization": {"term": "systematic desensitization", "short": "Gradual, positive exposure to a fear trigger — starting below the fear threshold and building up slowly.", "full": "The opposite of flooding. The dog is exposed to the trigger at low\nintensity, paired with something positive, and intensity increases only\nwhen the current level produces zero negative reaction. The noise\nconditioning ladder (pan drops → cap gun at distance → starter pistol) is\nsystematic desensitization. Each rung stays until the dog shows no\nconcern before advancing. If the dog shows fear at any step, go back\ntwo rungs and rebuild.\n", "see_also": ["flooding", "classical_conditioning"], "tracks": ["PP"]}, "tab": {"term": "tab", "short": "A short (4-6 inch) handle attached to the collar — gives the handler something to grab without the drag of a full lead.", "full": "The step between a dragging line and bare collar in the off-lead\nprogression. The tab provides a handle when the dog comes to you but no\nlength to grab or step on at distance. It tests whether the dog has truly\ninternalized the commands or was just responsive because the long line was\nthere.\n", "see_also": ["check_cord", "dragging_line"], "tracks": ["OB", "MK"]}, "three_ds": {"term": "three D's", "short": "Duration, Distance, Distraction — the three variables that make a command harder. Change only one at a time.", "full": "Duration is how long the dog holds. Distance is how far the handler is.\nDistraction is anything competing for the dog's attention. When you raise\none, lower the other two. Most steadiness failures happen because the\nhandler raised two or three at once. A new location counts as a massive\ndistraction increase — drop distance and duration back to their floors\nand rebuild.\n", "see_also": ["engineer_the_win", "steadiness"], "tracks": ["OB", "MK"]}, "variable_reinforcement": {"term": "variable reinforcement", "short": "Rewarding correct behavior unpredictably — sometimes after one rep, sometimes after five.", "full": "When first teaching a behavior, reward every time (continuous\nreinforcement). Once the behavior is reliable, begin varying when rewards\ncome. The unpredictability is what keeps the dog performing — like a slot\nmachine, the dog keeps trying because this time might be the one that\npays. Variable reinforcement makes behaviors more persistent. But never\nthin rewards so far that the training environment becomes unrewarding\ncompared to the world around the dog.\n", "see_also": ["premack_principle", "operant_conditioning"], "tracks": []}, "wagon_wheel": {"term": "wagon wheel", "short": "A 5-pile casting drill — back, two overs, and two angle backs arranged in a semicircle.", "full": "The full casting picture. Five piles at equal distance: right over, right\nangle back, straight back, left angle back, left over. Teaches the dog to\ndiscriminate between all five cast directions based on the handler's arm\nangle. Built after three-handed casting (baseball) is solid. Each angle\nback is taught in isolation before all five piles go out together.\n", "see_also": ["baseball", "angle_back", "casting"], "tracks": ["WH"]}, "over_suppression": {"term": "over-suppression", "short": "A dog that has been corrected too much — slow, reluctant, checking in instead of driving.", "full": "Warning signs: going slow off the line, refusing to leave the handler's\nside on the send, stopping mid-retrieve to look back (popping), glancing\nat the handler before the send as if asking permission, hesitating to\nleave the sit even after the release word. Any of these means the dog is\nworried about being wrong. The fix is always less pressure, not more.\nThrow fun retrieves to rebuild drive. A slow dog is a far more expensive\nproblem than a dog that breaks.\n", "see_also": ["popping", "steadiness"], "tracks": ["MK", "WH"]}}, "state": {"as_of": "", "tracks": {"HU": {"stood_down": null, "banked_stages": ["HU-1"], "current": "HU-2", "current_title": "Decoys — Through and Around", "next": "HU-2", "blocked_by": []}, "LN": {"stood_down": null, "banked_stages": ["LN-1", "LN-2", "LN-3", "LN-4", "LN-5"], "current": null, "current_title": null, "next": "LN-6", "blocked_by": ["WH-8"]}, "MK": {"stood_down": "MK-3", "banked_stages": ["MK-1", "MK-2"], "current": null, "current_title": null, "next": "MK-3", "blocked_by": ["MK-R6"]}, "OB": {"stood_down": null, "banked_stages": [], "current": "OB-1", "current_title": "Sit — Lure to Command", "next": "OB-1", "blocked_by": []}, "PP": {"stood_down": null, "banked_stages": [], "current": "PP-1", "current_title": "Coming Home — Crate Training", "next": "PP-1", "blocked_by": []}, "WA": {"stood_down": null, "banked_stages": ["WA-1", "WA-2"], "current": "WA-3", "current_title": "Water Singles with Steadiness", "next": "WA-3", "blocked_by": []}, "WH": {"stood_down": null, "banked_stages": [], "current": null, "current_title": null, "next": "WH-1", "blocked_by": ["OB-1"]}}, "asserts": {"MK-1|c1": {"card": "MK-1", "check": "c1", "source": "REBA_PROGRAM.md decision log 2026-08-09 — 'MK-1/MK-2 (Marks, steadiness — both passed and reconfirmed long ago)'", "note": "Pre-dates the written record. No per-session counts exist. Banked on Jason's word."}, "MK-2|c2": {"card": "MK-2", "check": "c2", "source": "Jason's ruling 2026-08-09, in response to the state engine's first run", "note": "No-bird reps were run and never written down. No counts exist. Banked on Jason's word."}}, "stand_downs": {"MK-3": {"card": "MK-3", "date": "2026-08-09", "why": "r1 ran 3/6 with a helper. She went out straight and hard; the return degraded — the helper was a thrower she has a relationship with, and r1's only new variable IS the second person.", "lifts_when":         criterion_set:!!(sd.revalidate&&sd.revalidate.length),lifted:!!lifted[code],progress:liftDetail[code]||[]}:null};
  }
  const trackBuckets = {};
  for (const [code, c] of Object.entries(outCards)) { if (!trackBuckets[c.track]) trackBuckets[c.track] = []; trackBuckets[c.track].push(code); }
  const positions = {};
  for (const [tag, codes] of Object.entries(trackBuckets)) {
    const stages = codes.map(c=>outCards[c]).filter(c=>c.type==='stage').sort((a,b)=>(a.n||0)-(b.n||0));
    const banked = stages.filter(s=>s.status==='banked').map(s=>s.code);
    const current = stages.find(s=>(s.status==='in_progress'||s.status==='not_started')&&s.gate_open);
    const sdStage = stages.find(s=>s.status==='stood_down');
    const nxt = stages.find(s=>s.status!=='banked');
    positions[tag] = {stood_down:sdStage?sdStage.code:null,banked_stages:banked,
      current:current?current.code:null,current_title:current?current.title:null,
      next:nxt?nxt.code:null,blocked_by:nxt?nxt.blocked_by:[]};
  }
  return {cards:outCards,tracks:positions,
    orphans:orphans.map(r=>({card:r.card,check:r.check,date:r.date})),
    superseded:superseded.map(r=>({card:r.card,check:r.check,date:r.date,hits:r.hits,of:r.of}))};
}

/* ── IndexedDB session storage + live state recompute ───────────────────── */
function openSessionsDB() {
  return new Promise((resolve, reject) => {
    /* Version 4: add 'events' store for non-card sessions (HRC tests, etc).
       Version 3 added 'outings'. Version 2 wiped stale test data.
       The 'rows' store is preserved across this upgrade. */
    const req = indexedDB.open('reba-sessions', 4);
    req.onupgradeneeded = (e) => {
      const db = req.result;
      if (e.oldVersion < 2) {
        if (db.objectStoreNames.contains('rows')) db.deleteObjectStore('rows');
        db.createObjectStore('rows', { autoIncrement: true });
      }
      if (!db.objectStoreNames.contains('outings')) {
        db.createObjectStore('outings', { autoIncrement: true });
      }
      if (!db.objectStoreNames.contains('events')) {
        db.createObjectStore('events', { autoIncrement: true });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbGetAll(db) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('rows', 'readonly');
    const req = tx.objectStore('rows').getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbPutAll(db, rows) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('rows', 'readwrite');
    const store = tx.objectStore('rows');
    for (const r of rows) store.put(r);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function idbGetOutings(db) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('outings', 'readonly');
    const req = tx.objectStore('outings').getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbPutOuting(db, outing) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('outings', 'readwrite');
    tx.objectStore('outings').put(outing);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function historyToRows() {
  const hist = (DECK.week || {}).history || {};
  const rows = [];
  for (const [date, entries] of Object.entries(hist)) {
    for (const e of entries) {
      rows.push({ card: e.code, check: e.check, date: String(date),
        hits: e.hits, of: e.of, counts: e.counts !== false,
        tod: e.tod, assist: 'none', rung: e.rung != null ? e.rung : undefined, machine: false, source: 'history' });
    }
  }
  return rows;
}
async function recomputeState() {
  try {
    const db = await openSessionsDB();
    const idbRows = await idbGetAll(db);
    const histRows = historyToRows();
    const allRows = histRows.concat(idbRows);
    const asserts = (DECK.state || {}).asserts || {};
    const standDowns = (DECK.state || {}).stand_downs || {};
    const result = computeState(DECK.cards, allRows, asserts, standDowns);
    const asOf = (DECK.state || {}).as_of || '';
    DECK.state = Object.assign(result, { asserts: asserts, stand_downs: standDowns, as_of: asOf });
    /* Patch DECK.week.history with IDB rows so the cadence strip, "last
       session" label, staleness, and day-row history all reflect sessions
       logged since the last build. */
    if (idbRows.length) {
      if (!DECK.week) DECK.week = {};
      if (!DECK.week.history) DECK.week.history = {};
      for (const r of idbRows) {
        if (!r.date || !r.card) continue;
        if (!DECK.week.history[r.date]) DECK.week.history[r.date] = [];
        const already = DECK.week.history[r.date].some(
          h => h.code === r.card && h.check === r.check);
        if (!already) {
          DECK.week.history[r.date].push({
            code: r.card, check: r.check,
            hits: r.hits, of: r.of, counts: r.counts !== false
          });
        }
      }
    }
    /* Merge IDB outings into DECK.sessions so the History tab shows
       sessions logged since the last build. */
    const idbOutings = await idbGetOutings(db);
    if (idbOutings.length) {
      if (!DECK.sessions) DECK.sessions = [];
      const built = new Set(DECK.sessions.map(o => o.date + '|' + (o.tod || '')));
      for (const o of idbOutings) {
        const key = o.date + '|' + (o.tod || '');
        if (!built.has(key)) { DECK.sessions.push(o); built.add(key); }
      }
      DECK.sessions.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    }
    /* Merge IDB events into DECK.events for the History tab */
    const idbEvents = await idbGetEvents(db);
    if (idbEvents.length) {
      if (!DECK.events) DECK.events = [];
      const builtE = new Set(DECK.events.map(e => e.date + '|' + (e.tod || '') + '|' + (e.event_type || '')));
      for (const ev of idbEvents) {
        const key = ev.date + '|' + (ev.tod || '') + '|' + (ev.event_type || '');
        if (!builtE.has(key)) { DECK.events.push(ev); builtE.add(key); }
      }
      DECK.events.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    }
    render();
  } catch (e) { console.error('recomputeState failed:', e); }
}
function idbGetEvents(db) {
  return new Promise((resolve, reject) => {
    if (!db.objectStoreNames.contains('events')) { resolve([]); return; }
    const tx = db.transaction('events', 'readonly');
    const req = tx.objectStore('events').getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbPutEvent(db, event) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('events', 'readwrite');
    tx.objectStore('events').put(event);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ── Firestore REST API — no SDK, just fetch ──────────────────────────────── */
const FS_PROJECT = 'reba-training-app';
const FS_API_KEY = 'AIzaSyDUL6hF8_W-ysx_3uSlqhNL-AYazzNj9BI';
const FS_BASE = 'https://firestore.googleapis.com/v1/projects/' + FS_PROJECT + '/databases/(default)/documents';

function fsDocValue(v) {
  if (v === null || v === undefined) return { nullValue: null };
  if (typeof v === 'boolean') return { booleanValue: v };
  if (typeof v === 'number') return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
  if (typeof v === 'string') return { stringValue: v };
  if (Array.isArray(v)) return { arrayValue: { values: v.map(fsDocValue) } };
  if (typeof v === 'object') {
    const fields = {};
    for (const [k, val] of Object.entries(v)) fields[k] = fsDocValue(val);
    return { mapValue: { fields } };
  }
  return { stringValue: String(v) };
}

function fsWrite(collection, data) {
  const fields = {};
  for (const [k, v] of Object.entries(data)) fields[k] = fsDocValue(v);
  // Add server timestamp
  fields.created_at = { timestampValue: new Date().toISOString() };
  return fetch(FS_BASE + '/' + collection + '?key=' + FS_API_KEY, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fields }),
  });
}

function fsReadAll(collection) {
  return fetch(FS_BASE + '/' + collection + '?key=' + FS_API_KEY + '&pageSize=500')
    .then(r => r.json())
    .then(data => (data.documents || []).map(doc => {
      const out = {};
      for (const [k, v] of Object.entries(doc.fields || {})) out[k] = fsParseValue(v);
      return out;
    }));
}

function fsParseValue(v) {
  if ('stringValue' in v) return v.stringValue;
  if ('integerValue' in v) return parseInt(v.integerValue, 10);
  if ('doubleValue' in v) return v.doubleValue;
  if ('booleanValue' in v) return v.booleanValue;
  if ('nullValue' in v) return null;
  if ('timestampValue' in v) return v.timestampValue;
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(fsParseValue);
  if ('mapValue' in v) {
    const out = {};
    for (const [k, fv] of Object.entries(v.mapValue.fields || {})) out[k] = fsParseValue(fv);
    return out;
  }
  return null;
}

/* ── GPS + site matching ──────────────────────────────────────────────────── */
const GEO_OPTS = { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 };
let lastGeoFix = null;

function geoMetres(a, b, c, d) {
  if ([a,b,c,d].some(v => !Number.isFinite(v))) return Infinity;
  const R = 6371000, r = Math.PI / 180;
  const p1 = a * r, p2 = c * r, dp = (c - a) * r, dl = (d - b) * r;
  const h = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function matchSite(lat, lon) {
  if (!SITES.length) return null;
  const scored = SITES.map(s => ({
    s, m: geoMetres(lat, lon, s.lat, s.lon)
  })).sort((a, b) => a.m - b.m);
  const inside = scored.filter(x => x.m <= x.s.radius_m);
  if (inside.length === 1) return { match: 'hit', site: inside[0].s, dist: inside[0].m };
  if (inside.length > 1) return { match: 'ambiguous', sites: inside.map(x => x.s), dists: inside.map(x => x.m) };
  return { match: 'none', nearest: scored[0].s, dist: scored[0].m };
}

function detectLocation() {
  if (!navigator.geolocation) {
    renderGeoResult({ error: 'No GPS on this device.' });
    return;
  }
  renderGeoResult({ acquiring: true });
  navigator.geolocation.getCurrentPosition(
    p => {
      lastGeoFix = p;
      const result = matchSite(p.coords.latitude, p.coords.longitude);
      result.accuracy = p.coords.accuracy;
      result.lat = p.coords.latitude;
      result.lon = p.coords.longitude;
      renderGeoResult(result);
      // Auto-set location if we got a clean match
      if (result.match === 'hit') {
        S.location = result.site.label;
        // Also fetch weather
        fetchSessionWeather(p.coords.latitude, p.coords.longitude);
      }
      render();
    },
    e => {
      const msgs = {
        1: 'Location denied. Allow in Settings.',
        2: 'No position. Try open sky.',
        3: 'Timed out — try again.'
      };
      renderGeoResult({ error: msgs[e.code] || 'GPS failed.' });
    },
    GEO_OPTS
  );
}
window.detectLocation = detectLocation;

function renderGeoResult(r) {
  const el = document.getElementById('geoResult');
  if (!el) return;
  if (r.acquiring) {
    el.innerHTML = '<span style="color:var(--muted)">Acquiring fix\u2026</span>';
    return;
  }
  if (r.error) {
    el.innerHTML = '<span style="color:var(--alert)">' + r.error + '</span>';
    return;
  }
  if (r.match === 'hit') {
    el.innerHTML = '<span style="color:#2F4A32;font-weight:700">\u2713 ' + r.site.label +
      '</span> <span style="color:var(--muted);font-size:12px">' + Math.round(r.dist) +
      ' m, fix \u00b1' + Math.round(r.accuracy) + ' m</span>';
  } else if (r.match === 'ambiguous') {
    el.innerHTML = '<span style="color:#9A7C42;font-weight:700">Multiple matches:</span> ' +
      r.sites.map((s, i) => s.label + ' (' + Math.round(r.dists[i]) + ' m)').join(', ');
  } else {
    el.innerHTML = '<span style="color:var(--muted)">No match — nearest: ' +
      r.nearest.label + ' at ' + Math.round(r.dist) + ' m</span>';
  }
}

/* ── Weather auto-fetch (Open-Meteo, same as reba-lab) ─────────────────── */
function fetchSessionWeather(lat, lon) {
  const vars = 'temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m';
  const units = '&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FChicago';
  const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat.toFixed(5) +
    '&longitude=' + lon.toFixed(5) + '&current=' + vars + units;
  fetch(url)
    .then(r => r.json())
    .then(data => {
      if (data.current && data.current.temperature_2m != null) {
        S.temp_f = String(Math.round(data.current.temperature_2m));
        const el = document.getElementById('wxInfo');
        if (el) {
          const c = data.current;
          const feels = c.apparent_temperature != null ? Math.round(c.apparent_temperature) : null;
          let info = Math.round(c.temperature_2m) + '\u00b0F';
          if (feels != null && Math.abs(feels - Math.round(c.temperature_2m)) >= 3)
            info += ' (feels ' + feels + '\u00b0)';
          if (c.wind_speed_10m) info += ', wind ' + Math.round(c.wind_speed_10m) + ' mph';
          // Heat warning for the dog
          if (feels != null && feels >= 90) {
            info = '\u26a0\ufe0f ' + info + ' — LIMIT WORK';
            el.style.color = '#A32E1E';
          } else if (feels != null && feels >= 80) {
            info = info + ' — shorter sessions';
            el.style.color = '#B8860B';
          } else {
            el.style.color = '#2F4A32';
          }
          el.textContent = info;
        }
        render();
      }
    })
    .catch(() => {}); // fail silently — manual entry is always there
}

/* ── Photo cropper: drag to position, pinch to zoom ──────────────────────── */
function showPhotoCropper(dogName, dataUrl) {
  const img = new Image();
  img.onload = function() {
    let scale = 1, ox = 0, oy = 0;
    const viewSize = 260;
    // Initial: fit image so shorter side = viewSize
    const fitScale = viewSize / Math.min(img.width, img.height);
    scale = fitScale;

    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;';

    const cropArea = document.createElement('div');
    cropArea.style.cssText = `width:${viewSize}px;height:${viewSize}px;border-radius:50%;overflow:hidden;position:relative;border:3px solid #fff;touch-action:none;`;

    const photo = document.createElement('img');
    photo.src = dataUrl;
    photo.style.cssText = 'position:absolute;transform-origin:0 0;pointer-events:none;';
    function updatePhoto() {
      photo.style.transform = `translate(${ox}px,${oy}px) scale(${scale})`;
    }
    updatePhoto();
    cropArea.appendChild(photo);

    // Drag to position
    let dragging = false, lastX = 0, lastY = 0;
    let lastDist = 0;
    cropArea.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) {
        dragging = true;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        dragging = false;
        lastDist = Math.hypot(e.touches[1].clientX - e.touches[0].clientX,
                              e.touches[1].clientY - e.touches[0].clientY);
      }
      e.preventDefault();
    }, {passive: false});
    cropArea.addEventListener('touchmove', function(e) {
      if (e.touches.length === 1 && dragging) {
        ox += e.touches[0].clientX - lastX;
        oy += e.touches[0].clientY - lastY;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
        updatePhoto();
      } else if (e.touches.length === 2) {
        const dist = Math.hypot(e.touches[1].clientX - e.touches[0].clientX,
                                e.touches[1].clientY - e.touches[0].clientY);
        if (lastDist > 0) {
          const delta = dist / lastDist;
          scale *= delta;
          scale = Math.max(fitScale * 0.5, Math.min(fitScale * 5, scale));
          updatePhoto();
        }
        lastDist = dist;
      }
      e.preventDefault();
    }, {passive: false});

    const btnRow = document.createElement('div');
    btnRow.style.cssText = 'display:flex;gap:16px;margin-top:24px;';

    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = 'Cancel';
    cancelBtn.style.cssText = 'padding:12px 28px;border:2px solid #fff;background:none;color:#fff;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;';
    cancelBtn.onclick = () => overlay.remove();

    const saveBtn = document.createElement('button');
    saveBtn.textContent = 'Save';
    saveBtn.style.cssText = 'padding:12px 28px;border:none;background:var(--accent);color:#fff;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;';
    saveBtn.onclick = function() {
      const canvas = document.createElement('canvas');
      canvas.width = 120; canvas.height = 120;
      const ctx = canvas.getContext('2d');
      const outScale = 120 / viewSize;
      ctx.drawImage(img, -ox / scale, -oy / scale, viewSize / scale, viewSize / scale, 0, 0, 120, 120);
      setDogPhoto(dogName, canvas.toDataURL('image/jpeg', 0.85));
      overlay.remove();
      renderHub();
      renderHome();
    };

    btnRow.appendChild(cancelBtn);
    btnRow.appendChild(saveBtn);

    const hint = document.createElement('div');
    hint.textContent = 'Drag to position \u00b7 Pinch to zoom';
    hint.style.cssText = 'color:rgba(255,255,255,.6);font-size:13px;margin-top:12px;';

    overlay.appendChild(cropArea);
    overlay.appendChild(btnRow);
    overlay.appendChild(hint);
    document.body.appendChild(overlay);
  };
  img.src = dataUrl;
}
window.showPhotoCropper = showPhotoCropper;

function esc(s){return (s??'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;');}

/* ------------------------------ GLOSSARY -------------------------------- */
function renderText(text) {
  if (!text) return '';
  const TOKEN = /\{(term|ref):([^}]+)\}/g;
  let result = '';
  let last = 0;
  let m;
  while ((m = TOKEN.exec(text)) !== null) {
    // escape plain segment before this token
    result += esc(text.slice(last, m.index));
    last = m.index + m[0].length;
    const type = m[1];
    const val  = m[2];
    if (type === 'term') {
      const entry = DECK.glossary && DECK.glossary[val];
      const display = entry ? entry.term : val;
      result += `<span class="gterm" data-gkey="${esc(val)}">${esc(display)}</span>`;
    } else {
      // {ref:id} or {ref:trackid|track} or {ref:id|full}
      const pipeIdx = val.indexOf('|');
      if (pipeIdx !== -1) {
        const trackId = val.slice(0, pipeIdx);
        const mode    = val.slice(pipeIdx + 1);
        if (mode === 'track') {
          // find any card whose id starts with trackId + "."
          const tc = DECK.cards.find(x => x.id && x.id.startsWith(trackId + '.'));
          const label = tc ? tc.trackName : trackId;
          result += `<span class="gref" data-track="${esc(trackId)}">${esc(label)}</span>`;
        } else {
          // {ref:id|full} — link to specific card
          const fc = DECK.cards.find(x => x.id === trackId);
          const label = fc ? fc.code : trackId;
          result += `<span class="gref" data-ref="${esc(trackId)}">${esc(label)}</span>`;
        }
      } else {
        // plain {ref:id}
        const fc = DECK.cards.find(x => x.id === val);
        const label = fc ? fc.code : val;
        result += `<span class="gref" data-ref="${esc(val)}">${esc(label)}</span>`;
      }
    }
  }
  result += esc(text.slice(last));
  return result;
}

function showGlossary(key) {
  const old = document.getElementById('gloss-overlay');
  if (old) old.remove();
  const entry = DECK.glossary && DECK.glossary[key];
  if (!entry) return;

  const overlay = document.createElement('div');
  overlay.className = 'gloss-overlay';
  overlay.id = 'gloss-overlay';
  overlay.onclick = () => overlay.remove();

  let seeAlso = '';
  if (entry.see_also && entry.see_also.length) {
    seeAlso = `<div class="gloss-also">
      <div class="gloss-also-lbl">SEE ALSO</div>
      ${entry.see_also.map(k => {
        const e2 = DECK.glossary && DECK.glossary[k];
        const lbl = e2 ? e2.term : k;
        return `<button class="gloss-see" data-gkey="${esc(k)}">${esc(lbl)}</button>`;
      }).join('')}
    </div>`;
  }

  const box = document.createElement('div');
  box.className = 'gloss-box';
  box.onclick = e => e.stopPropagation();
  box.innerHTML = `<div class="gloss-tname">${esc(entry.term)}</div>
    <div class="gloss-short">${esc(entry.short)}</div>
    <div class="gloss-full">${esc((entry.full || '').trim())}</div>
    ${seeAlso}`;

  overlay.appendChild(box);
  document.body.appendChild(overlay);
  // Wire see-also buttons after DOM insertion — can't use document-level
  // delegation because box.onclick calls stopPropagation().
  box.querySelectorAll('.gloss-see').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      haptic();
      showGlossary(btn.dataset.gkey);
    });
  });
}

function cardDetail(c){
  const accent = c.type==='gate' ? 'var(--alert)' : c.color;
  const list = DECK.cards.filter(x => !state.trackFilter || x.track===state.trackFilter);
  const i = list.findIndex(x => x.code===c.code);
  const prev = i > 0 ? list[i-1] : null;
  const next = i < list.length-1 ? list[i+1] : null;
  const cs = (DECK.state && DECK.state.cards) ? DECK.state.cards[c.code] : null;

  /* Update the tab bar to show card-level navigation.
     Back goes to where you came from — if opened from Tracks, back goes to Tracks. */
  const backAction = state.prevTab && state.prevTab !== 'cards'
    ? `state.openCard=null;tab('${state.prevTab}')`
    : `state.openCard=null;render()`;
  const backLabel = state.prevTab && state.prevTab !== 'cards'
    ? ({week:'Week',tracks:'Tracks',log:'Log'}[state.prevTab] || 'Back')
    : 'Cards';
  const tabBar = document.querySelector('.tab-bar');
  if (tabBar) {
    tabBar.innerHTML = `<button class="tab-back" onclick="haptic();${backAction}" aria-label="Back">&#8249;</button>` +
      (prev ? `<button class="card-step" onclick="haptic();state.openCard='${prev.code}';render()">&#8249; ${prev.code}</button>` : '<span class="card-step-end"></span>') +
      `<span class="tab-title" style="text-align:center">${c.code}</span>` +
      (next ? `<button class="card-step" onclick="haptic();state.openCard='${next.code}';render()">${next.code} &#8250;</button>` : '<span class="card-step-end"></span>');
  }

  let h = '';

  /* ── card header ── */

        <div class="code">${c.code} · ${esc(c.trackName)}${c.trigger?' · '+esc(c.trigger):''}</div>
        <div class="title">${esc(c.title)}</div>`;
  if (cs) h += `<div style="margin-top:6px">${badge(cs.status)}</div>`;

        <span class="req-code">${esc(r)}</span>

        <span class="req-arrow">&#8250;</span></button>`;

  if(c.diagram) h += `<div class="sec"><button class="dgmbtn" onclick="openDiagram('${c.diagram}','${c.code}')">VIEW DIAGRAM &nbsp;&#8250;</button></div>`;
  if(c.body) h += `<div class="sec"><div class="txt">${renderText(c.body.trim())}</div></div>`;
  if(c.drill) h += `<div class="sec"><h4>DRILL</h4><div class="txt">${renderText(c.drill.trim())}</div></div>`;
  if(c.pass) h += `<div class="sec"><h4>PASS</h4><div class="txt">${renderText(c.pass.trim())}</div></div>`;

  /* ── checks with progress bars ── */
